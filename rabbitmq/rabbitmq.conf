# Issue #279 item 1 — load per-service users/vhost permissions from
# definitions.json on node boot instead of the single shared
# RABBITMQ_DEFAULT_USER/PASS admin account every service used to share.
#
# management.load_definitions runs on EVERY node boot (not just a fresh
# node): it defines any users/vhosts/permissions/etc. from the file that
# don't already exist, but never deletes existing objects or overwrites an
# existing user's password. So on an existing volume, a plain restart is
# enough to pick up new users added here — see .claude/rules/local-dev.md
# for the one exception (rotating an already-existing user's password).
management.load_definitions = /etc/rabbitmq/definitions.json
