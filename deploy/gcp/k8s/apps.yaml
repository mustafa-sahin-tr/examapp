apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-outbox-publisher
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-outbox-publisher
  template:
    metadata:
      labels:
        app: exam-outbox-publisher
    spec:
      containers:
        - name: exam-outbox-publisher
          image: REPLACE_IMAGE/exam-outbox-publisher:latest
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: CONNECTIONSTRINGS_EXAM
            # Issue #279: dedicated least-privilege user (created by the
            # rabbitmq-init Job below) — write access only to the
            # worksheet-DB outbox event exchanges, no queue/read access.
            - name: RabbitMQ__Host
              value: rabbitmq.examapp.svc.cluster.local
            - name: RabbitMQ__Username
              value: exam_outbox_pub
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_EXAM_OUTBOX_PASSWORD

---
# Issue #84 / #243: second instance of the OutboxPublisher code (same image as
# exam-outbox-publisher), pointed at auth-api's "auth_db" (identity) database.
# Relays auth-api's outbox events (e.g. account/notification events) to
# RabbitMQ. 1 replica is enough; scaling out is safe (FOR UPDATE SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-outbox-publisher
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-outbox-publisher
  template:
    metadata:
      labels:
        app: identity-outbox-publisher
    spec:
      containers:
        - name: identity-outbox-publisher
          image: REPLACE_IMAGE/exam-outbox-publisher:latest
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: CONNECTIONSTRINGS_AUTH
            # Issue #279: dedicated least-privilege user (created by the
            # rabbitmq-init Job below) — write access only to
            # LoginAttemptedEvent/UserPreferredLocaleChangedEvent, no
            # queue/read access.
            - name: RabbitMQ__Host
              value: rabbitmq.examapp.svc.cluster.local
            - name: RabbitMQ__Username
              value: identity_outbox_pub
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_IDENTITY_OUTBOX_PASSWORD

---
# Issue #225: third instance of the OutboxPublisher code (same image as
# exam-outbox-publisher), pointed at BadgeService's "badge" DB. Relays
# StudentPointsChangedEvent from the badge OutboxMessages table to RabbitMQ
# for exam-dotnet-api. 1 replica is enough; scaling out is safe (FOR UPDATE SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: badge-outbox-publisher
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: badge-outbox-publisher
  template:
    metadata:
      labels:
        app: badge-outbox-publisher
    spec:
      containers:
        - name: badge-outbox-publisher
          image: REPLACE_IMAGE/exam-outbox-publisher:latest
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: CONNECTIONSTRINGS_BADGE
            # Issue #279: dedicated least-privilege user (created by the
            # rabbitmq-init Job below) — the ONLY user allowed to write
            # StudentPointsChangedEvent (closes the fake-event risk).
            - name: RabbitMQ__Host
              value: rabbitmq.examapp.svc.cluster.local
            - name: RabbitMQ__Username
              value: badge_outbox_pub
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_OUTBOX_PASSWORD

