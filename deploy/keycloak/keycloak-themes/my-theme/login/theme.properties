# Per-type theme.properties for the "login" type. Keycloak resolves each
# theme type's parent chain (and, critically, its message bundle
# inheritance) from a theme.properties file inside that specific type
# folder — the theme-root theme.properties (../theme.properties) is only a
# fallback for types this theme doesn't specialise (account, email, admin).
# Without this file, msg() lookups for Keycloak's own base keys (doLogIn,
# usernameOrEmail, password, rememberMe, doForgotPassword, noAccount,
# doRegister, email, doSubmit, backToLogin, updatePasswordTitle,
# passwordNew, passwordConfirm, emailForgotTitle, errorTitle,
# backToApplication, ...) silently fail and render the raw key name instead
# of the localized TR/EN text (found while verifying issue #186).
#
# parent=keycloak (not keycloak.v2) because our own login.ftl/template.ftl/
# error.ftl/login-reset-password.ftl/login-update-password.ftl use the
# legacy theme's simple CSS class conventions (.auth-area, .auth-form-col,
# etc.), not keycloak.v2's PatternFly-based markup. Any template we don't
# override (registration, OTP setup, WebAuthn, terms, page-expired, ...)
# falls back to this parent's own markup.
parent=keycloak
import=common/keycloak

# Pages we do not override (register, update profile, IdP link, OTP setup, ...) build their markup
# from these class properties. The parent's values are PatternFly / Bootstrap classes whose CSS this
# theme does not load, so those pages rendered as bare forms (grey native button, labels glued to the
# inputs, empty squares for the password visibility icon). Map them onto custom.css instead.
kcFormClass=auth-form
kcFormGroupClass=form-group
kcLabelWrapperClass=form-label-row
kcLabelClass=form-label
kcInputWrapperClass=form-input
kcInputClass=form-control
kcInputGroup=input-group
kcInputErrorMessageClass=field-error
kcInputHelperTextBeforeClass=field-help
kcInputHelperTextAfterClass=field-help
kcFormOptionsClass=form-options
kcFormOptionsWrapperClass=form-options__inner
kcFormButtonsClass=form-buttons
kcButtonClass=default-btn
kcButtonPrimaryClass=
kcButtonBlockClass=
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=password-toggle
kcFormPasswordVisibilityIconShow=password-toggle__icon password-toggle__icon--show
kcFormPasswordVisibilityIconHide=password-toggle__icon password-toggle__icon--hide
