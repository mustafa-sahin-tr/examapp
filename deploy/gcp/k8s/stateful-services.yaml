apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: examapp
data:
  init.sql: |
    CREATE DATABASE worksheet_v2;
    CREATE DATABASE auth_db;
    CREATE DATABASE badge;
    CREATE DATABASE keycloak;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: examapp
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: examapp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: examapp
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: examapp
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command:
            - sh
            - -c
            - redis-server --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: examapp
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: examapp
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_PASS
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-init-script
  namespace: examapp
data:
  rabbitmq-init.sh: |
    #!/bin/sh
    # Issue #279 item 1 (prod) — creates/updates the 5 per-service RabbitMQ users
    # and their least-privilege permissions via the management HTTP API. Run as
    # the `rabbitmq-init` one-shot container in deploy/docker-compose.prod.yml
    # (and the equivalent Kubernetes Job in deploy/gcp/k8s/), after the RabbitMQ
    # node is healthy and before any application service starts.
    #
    # Idempotent: PUT /api/users/{user} and PUT /api/permissions/{vhost}/{user}
    # both upsert, so re-running this (every deploy) is safe and converges to the
    # same state — including picking up a rotated *_PASSWORD secret.
    #
    # IMPORTANT: the permission regexes below are the prod mirror of
    # rabbitmq/definitions.json's dev `permissions` block (issue #279's matrix —
    # see .claude/rules/local-dev.md). There is no shared/generated source
    # between the two files; if you add/remove an outbox event or a consumer's
    # subscribed event list, update BOTH by hand.
    set -eu

    : "${RABBITMQ_USER:?RABBITMQ_USER not set}"
    : "${RABBITMQ_PASS:?RABBITMQ_PASS not set}"
    : "${RABBITMQ_EXAM_OUTBOX_PASSWORD:?RABBITMQ_EXAM_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_IDENTITY_OUTBOX_PASSWORD:?RABBITMQ_IDENTITY_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_BADGE_OUTBOX_PASSWORD:?RABBITMQ_BADGE_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_BADGE_SERVICE_PASSWORD:?RABBITMQ_BADGE_SERVICE_PASSWORD not set}"
    : "${RABBITMQ_EXAM_API_PASSWORD:?RABBITMQ_EXAM_API_PASSWORD not set}"

    RABBIT_HOST="${RABBITMQ_HOST:-rabbitmq}"
    RABBIT_URL="http://${RABBIT_HOST}:15672"
    ADMIN_AUTH="${RABBITMQ_USER}:${RABBITMQ_PASS}"
    VHOST="%2F" # "/" URL-encoded

    # Wait for the management API (not just the AMQP port) to answer, since we
    # only talk to :15672 below. docker-compose.prod.yml's rabbitmq-init already
    # waits on `rabbitmq: condition: service_healthy`, but Kubernetes has no
    # equivalent Job-level dependency wait, so this loop is the only thing that
    # makes the Job safe to start immediately alongside the StatefulSet.
    echo "rabbitmq-init: waiting for ${RABBIT_URL}/api/overview ..."
    i=0
    until curl -sf -u "${ADMIN_AUTH}" "${RABBIT_URL}/api/overview" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 60 ]; then
        echo "rabbitmq-init: gave up waiting for RabbitMQ management API after 60 attempts" >&2
        exit 1
      fi
      sleep 2
    done
    echo "rabbitmq-init: RabbitMQ management API is up"

    NS='ExamApp\.Foundation\.Contracts'

    # Publisher event lists (must match OutboxEventRegistry entries actually
    # written by each DB's outbox — see the _comment fields in
    # rabbitmq/definitions.json for the grep-verified source of truth).
    EXAM_OUTBOX_EVENTS="AnswerSubmittedEvent|QuestionCreatedEvent|WorksheetReminderDueEvent|WorksheetAccessRequestedEvent|WorksheetAccessRequestApprovedEvent|WorksheetAccessRequestRejectedEvent|TeacherApplicationSubmittedEvent|TeacherApplicationDecidedEvent|IndependentTeacherRegisteredEvent|BookingRequestCreatedEvent|BookingDecisionEvent|UserPreferredLocaleChangedEvent"
    IDENTITY_OUTBOX_EVENTS="LoginAttemptedEvent|UserPreferredLocaleChangedEvent"
    BADGE_OUTBOX_EVENTS="StudentPointsChangedEvent"
    # badge_service consumes everything except StudentPointsChangedEvent.
    BADGE_SERVICE_EVENTS="AnswerSubmittedEvent|QuestionCreatedEvent|WorksheetReminderDueEvent|WorksheetAccessRequestedEvent|WorksheetAccessRequestApprovedEvent|WorksheetAccessRequestRejectedEvent|LoginAttemptedEvent|TeacherApplicationSubmittedEvent|TeacherApplicationDecidedEvent|IndependentTeacherRegisteredEvent|BookingRequestCreatedEvent|BookingDecisionEvent|UserPreferredLocaleChangedEvent"
    EXAM_API_EVENTS="StudentPointsChangedEvent"

    create_user() {
      user="$1"
      pass="$2"
      echo "rabbitmq-init: upserting user '${user}'"
      curl -sf -u "${ADMIN_AUTH}" -X PUT "${RABBIT_URL}/api/users/${user}" \
        -H 'content-type: application/json' \
        -d "{\"password\":\"${pass}\",\"tags\":\"\"}"
    }

    # Consumers must NEVER get "write" on message-type exchanges — that would let
    # them publish/forge the events they're supposed to only consume (the exact
    # risk issue #279 closes). Publishers get write==configure on their message
    # exchanges and no queue (read is empty). Consumers get write scoped to only
    # their own queue/exchange/_error/_skipped; configure+read additionally cover
    # the message exchanges they bind from (RabbitMQ's exchange.bind/queue.bind
    # need read-on-source + write-on-destination — see rabbitmq/definitions.json
    # comments for the full reasoning). PublishFaults is off for every consumer
    # (issue #279, C# side) so no MassTransit.Fault:* exchange access is granted.
    set_perms() {
      user="$1"
      configure="$2"
      write="$3"
      read="$4"
      echo "rabbitmq-init: setting permissions for '${user}'"
      curl -sf -u "${ADMIN_AUTH}" -X PUT "${RABBIT_URL}/api/permissions/${VHOST}/${user}" \
        -H 'content-type: application/json' \
        -d "{\"configure\":\"${configure}\",\"write\":\"${write}\",\"read\":\"${read}\"}"
    }

    # --- Publishers: configure+write on their message exchanges only, no queue ---

    create_user exam_outbox_pub "${RABBITMQ_EXAM_OUTBOX_PASSWORD}"
    set_perms exam_outbox_pub \
      "^${NS}:(${EXAM_OUTBOX_EVENTS})\$" \
      "^${NS}:(${EXAM_OUTBOX_EVENTS})\$" \
      '^$'

    create_user identity_outbox_pub "${RABBITMQ_IDENTITY_OUTBOX_PASSWORD}"
    set_perms identity_outbox_pub \
      "^${NS}:(${IDENTITY_OUTBOX_EVENTS})\$" \
      "^${NS}:(${IDENTITY_OUTBOX_EVENTS})\$" \
      '^$'

    create_user badge_outbox_pub "${RABBITMQ_BADGE_OUTBOX_PASSWORD}"
    set_perms badge_outbox_pub \
      "^${NS}:(${BADGE_OUTBOX_EVENTS})\$" \
      "^${NS}:(${BADGE_OUTBOX_EVENTS})\$" \
      '^$'

    # --- Consumers: write restricted to their own queue/exchange, never a message exchange ---

    create_user badge_service "${RABBITMQ_BADGE_SERVICE_PASSWORD}"
    set_perms badge_service \
      "^(badge-service(_error|_skipped)?|${NS}:(${BADGE_SERVICE_EVENTS}))\$" \
      '^badge-service(_error|_skipped)?$' \
      "^(badge-service(_error|_skipped)?|${NS}:(${BADGE_SERVICE_EVENTS}))\$"

    create_user exam_api "${RABBITMQ_EXAM_API_PASSWORD}"
    set_perms exam_api \
      "^(exam-api(_error|_skipped)?|${NS}:(${EXAM_API_EVENTS}))\$" \
      '^exam-api(_error|_skipped)?$' \
      "^(exam-api(_error|_skipped)?|${NS}:(${EXAM_API_EVENTS}))\$"

    echo 'rabbitmq-init: done'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
  namespace: examapp
spec:
  # Issue #279 item 1 — creates the 5 per-service RabbitMQ users + their
  # least-privilege permissions via the management HTTP API (same script as
  # deploy/scripts/rabbitmq-init.sh / docker-compose.prod.yml's rabbitmq-init
  # service). Idempotent, so re-applying this Job on every deploy (e.g. via
  # `kubectl delete job rabbitmq-init --ignore-not-found && kubectl apply -f
  # stateful-services.yaml`, since Jobs are immutable once created) is safe.
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rabbitmq-init
          image: curlimages/curl:8.10.1
          command: ['sh', '/scripts/rabbitmq-init.sh']
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.examapp.svc.cluster.local
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_PASS
            - name: RABBITMQ_EXAM_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_EXAM_OUTBOX_PASSWORD
            - name: RABBITMQ_IDENTITY_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_IDENTITY_OUTBOX_PASSWORD
            - name: RABBITMQ_BADGE_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_OUTBOX_PASSWORD
            - name: RABBITMQ_BADGE_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_SERVICE_PASSWORD
            - name: RABBITMQ_EXAM_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_EXAM_API_PASSWORD
          volumeMounts:
            - name: rabbitmq-init-script
              mountPath: /scripts
      volumes:
        - name: rabbitmq-init-script
          configMap:
            name: rabbitmq-init-script
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: examapp
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: examapp
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: examapp
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.1
          args:
            - start-dev
            - --http-enabled=true
            - --hostname-strict=false
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres.examapp.svc.cluster.local
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_PROXY
              value: edge
            - name: KC_HEALTH_ENABLED
              value: 'true'
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
