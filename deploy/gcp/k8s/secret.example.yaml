apiVersion: v1
kind: Secret
metadata:
  name: examapp-secrets
  namespace: examapp
type: Opaque
stringData:
  JWT_KEY: CHANGE_ME_MIN_32_CHARS

  POSTGRES_USER: examuser
  POSTGRES_PASSWORD: CHANGE_ME

  REDIS_PASSWORD: CHANGE_ME
  REDIS_CONNECTION: redis.examapp.svc.cluster.local:6379,password=CHANGE_ME

  # RABBITMQ_USER/PASS is the ops-only admin account (management HTTP API,
  # used only by the rabbitmq-init Job in stateful-services.yaml). Issue
  # #279: application Deployments no longer use it — each gets its own
  # least-privilege user below, created by that Job at deploy time (never a
  # committed definitions file with baked-in prod passwords). Usernames
  # themselves (exam_outbox_pub, identity_outbox_pub, badge_outbox_pub,
  # badge_service, exam_api, auth_api) are fixed, non-secret literals in
  # apps.yaml — only the passwords live here.
  RABBITMQ_USER: rabbituser
  RABBITMQ_PASS: CHANGE_ME
  RABBITMQ_EXAM_OUTBOX_PASSWORD: CHANGE_ME
  RABBITMQ_IDENTITY_OUTBOX_PASSWORD: CHANGE_ME
  RABBITMQ_BADGE_OUTBOX_PASSWORD: CHANGE_ME
  RABBITMQ_BADGE_SERVICE_PASSWORD: CHANGE_ME
  RABBITMQ_EXAM_API_PASSWORD: CHANGE_ME
  # Issue #277 (madde 4): auth-api's own MassTransit consumer user (queue "auth-api",
  # UserRoleChangedEvent from exam API's outbox).
  RABBITMQ_AUTH_API_PASSWORD: CHANGE_ME

  GEMINI_API_KEY: CHANGE_ME

  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: CHANGE_ME

  KEYCLOAK_CLIENT_ID: exam-client
  KEYCLOAK_CLIENT_SECRET: CHANGE_ME
  KEYCLOAK_ADMIN_CLIENT_ID: exam-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: CHANGE_ME

  CONNECTIONSTRINGS_EXAM: Host=<CLOUD_SQL_PRIVATE_IP_OR_DNS>;Port=5432;Database=worksheet_v2;Username=examuser;Password=CHANGE_ME
  CONNECTIONSTRINGS_AUTH: Host=<CLOUD_SQL_PRIVATE_IP_OR_DNS>;Port=5432;Database=auth_db;Username=examuser;Password=CHANGE_ME
  CONNECTIONSTRINGS_BADGE: Host=<CLOUD_SQL_PRIVATE_IP_OR_DNS>;Port=5432;Database=badge;Username=examuser;Password=CHANGE_ME
