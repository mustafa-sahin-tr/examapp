<div class="auth-area">
  <div class="auth-inner">

    <div class="auth-image-col">
      <img src="assets/images/register-illustration.svg" alt="Profil Tamamla" />
    </div>

    <div class="auth-form-col">
      <div class="auth-form-header">
        <h3>Profilini Tamamla</h3>
        <p>Devam etmeden önce sana en uygun rolü seç.</p>
      </div>

      <div class="role-list">
        @for (option of roleOptions; track option.value) {
        <button
          type="button"
          class="role-card"
          [class.role-card-selected]="selectedRole() === option.value"
          (click)="selectRole(option.value)"
        >
          <span class="role-card-title">{{ option.label }}</span>
          <span class="role-card-desc">{{ option.description }}</span>
        </button>
        }
      </div>

      <div class="auth-submit">
        <button type="button" class="default-btn" [disabled]="!selectedRole() || isLoading()" (click)="onSubmit()">
          @if (isLoading()) {
          Kaydediliyor...
          } @else {
          Devam Et
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" viewBox="0 0 18 14" fill="none">
            <path opacity="0.5" d="M16.25 6.75V7.25H1.25V6.75H16.25Z" fill="white" stroke="white" />
            <path
              d="M10.75 1L16.75 7L10.75 13"
              stroke="white"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          }
        </button>
      </div>
    </div>

  </div>
</div>
