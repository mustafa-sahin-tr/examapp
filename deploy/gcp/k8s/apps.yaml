apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-badge-api
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-badge-api
  template:
    metadata:
      labels:
        app: exam-badge-api
    spec:
      containers:
        - name: exam-badge-api
          image: REPLACE_IMAGE/exam-badge-api:latest
          ports:
            - containerPort: 8006
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Kestrel__Port
              value: '8006'
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: CONNECTIONSTRINGS_BADGE
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: JWT_KEY
            - name: Server__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: PUBLIC_BASE_URL
            # Issue #279: dedicated least-privilege user (created by the
            # rabbitmq-init Job below) — every outbox event except
            # StudentPointsChangedEvent, never write access to it.
            - name: RabbitMQ__Host
              value: rabbitmq.examapp.svc.cluster.local
            - name: RabbitMQ__Username
              value: badge_service
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_SERVICE_PASSWORD
            - name: Keycloak__Authority
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: KEYCLOAK_AUTHORITY
            - name: Keycloak__Host
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: KEYCLOAK_HOST_INTERNAL
            - name: Keycloak__Realm
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: KEYCLOAK_REALM
            - name: Keycloak__ClientId
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_CLIENT_ID
            - name: Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: Keycloak__AdminClientId
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_ID
            - name: Keycloak__AdminClientSecret
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: Keycloak__TokenUrl
              value: realms/exam-realm/protocol/openid-connect/token
            - name: Keycloak__RealmRolesUrl
              value: admin/realms/exam-realm/roles
            - name: MinioConfig__Endpoint
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: MINIO_ENDPOINT
            - name: MinioConfig__AccessKey
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_USER
            - name: MinioConfig__SecretKey
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MinioConfig__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: MINIO_BASE_URL
            - name: ExamApi__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: EXAM_API_BASE_URL
            # Issue #165: caller user id lookup via GET /api/auth/user-profile
            # on auth-api. Reuses the same configmap key exam-dotnet-api's
            # AuthApiBaseUrl already reads (AUTH_API_BASE_URL, above).
            - name: AuthApi__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: AUTH_API_BASE_URL
            - name: QuestionAnalyzer__AIActive
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: BADGE_AI_ACTIVE
            - name: Gemini__Model
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: GEMINI_MODEL
            - name: Gemini__CachedContent
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: GEMINI_CACHED_CONTENT
            - name: Gemini__ApiKey
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: GEMINI_API_KEY
