<section class="asum" *transloco="let t; prefix: 'shared.activity.summary'" data-testid="activity-summary">
  <h1 class="asum__title" tabindex="-1">
    <mat-icon aria-hidden="true">celebration</mat-icon>{{ t('title') }}
  </h1>
  @if (result(); as r) {
    <p class="asum__info" data-testid="summary-info">{{ t('info', { correct: r.correct, total: r.total }) }}</p>
  }

  <app-activity-progress [today]="today()" [badge]="badge()" />

  <div class="asum__actions">
    @if (hasNext()) {
      <button mat-flat-button type="button" class="asum__btn" data-testid="next-activity" [disabled]="nextBusy()" (click)="next.emit()">
        <mat-icon>arrow_forward</mat-icon>{{ t('next') }}
      </button>
    }
    <button mat-stroked-button type="button" class="asum__btn" data-testid="back-to-list" (click)="backToList.emit()">
      <mat-icon>list</mat-icon>{{ t('backToList') }}
    </button>
  </div>
</section>
