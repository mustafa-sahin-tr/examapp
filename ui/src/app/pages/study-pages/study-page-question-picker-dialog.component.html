<ng-container *transloco="let t; prefix: 'study-pages.blocks.picker'">
  <h2 mat-dialog-title>{{ t('title') }}</h2>
  <mat-dialog-content class="spq">
    <mat-button-toggle-group [value]="scope()" (change)="setScope($event.value)" [attr.aria-label]="t('scope')">
      <mat-button-toggle value="mine">{{ t('mine') }}</mat-button-toggle>
      <mat-button-toggle value="all">{{ t('all') }}</mat-button-toggle>
    </mat-button-toggle-group>

    @if (loadFailed()) {
    <p class="spq__state spq__state--error">{{ t('loadFailed') }}</p>
    } @else if (!loading() && items().length === 0) {
    <p class="spq__state">{{ t('empty') }}</p>
    }

    <div class="spq__grid">
      @for (item of items(); track item.id) {
      <button type="button" class="spq__item" (click)="pick(item)" [attr.aria-label]="t('pickAria', { id: item.id })" data-testid="picker-item">
        @if (item.imageUrl) {
        <img [src]="item.imageUrl" alt="" loading="lazy" />
        } @else {
        <span class="spq__text" [innerHTML]="item.text || ''"></span>
        }
        <small>#{{ item.id }}@if (item.topicName) { · {{ item.topicName }} }</small>
      </button>
      }
    </div>

    @if (loading()) {
    <mat-spinner diameter="28" class="spq__spinner"></mat-spinner>
    } @else if (items().length < total()) {
    <button mat-stroked-button type="button" (click)="load(false)">{{ t('more') }}</button>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>{{ t('cancel') }}</button>
  </mat-dialog-actions>
</ng-container>
