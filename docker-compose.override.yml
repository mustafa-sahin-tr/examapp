version: '3.8'
services:
  exam-dotnet-api:
    command: sh -c "dotnet nuget locals all --clear && dotnet restore && dotnet ef database update --project ExamApp.Api && dotnet watch run --project ExamApp.Api --urls=http://+:5079"

  auth-api:
    command: sh -c "dotnet nuget locals all --clear && dotnet restore && dotnet ef database update && dotnet watch run --urls=http://+:5079"

  exam-badge-api:
    command: dotnet run --urls=http://+:8006

  ocelot-gateway:
    command: dotnet watch run --urls=http://+:5678

  exam-outbox-publisher:
    command: dotnet watch run --urls=http://+:8007

  identity-outbox-publisher:
    command: dotnet watch run --urls=http://+:8008

  badge-outbox-publisher:
    command: dotnet watch run --urls=http://+:8009

  angular-app:
    command: sh -c "yarn install && yarn start"

  auth-ui:
    command: sh -c "yarn install && yarn start"

  question-detector-dev:
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload


  keycloak:
    # command: start-dev --import-realm --spi-login-protocol-openid-connect-require-ssl=false
    command: start-dev --http-enabled=true --hostname-strict=false --import-realm
    environment:
      KC_LOG_LEVEL: DEBUG
      KEYCLOAK_SSL_REQUIRED: none
      # start-dev caches themes/templates by default; without disabling this,
      # edits under deploy/keycloak/keycloak-themes/my-theme (ftl/properties)
      # require a container restart to show up instead of a page refresh.
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    volumes:
      # NOTE: previously mounted the stale root-level ./keycloak-themes/my-theme
      # (no login.ftl/template.ftl overrides, different parent theme) — that
      # directory is a leftover/orphaned experiment and does NOT match what
      # deploy/docker-compose.prod.yml and AppHost.cs mount. Point dev at the
      # same source of truth as prod so login/consent/error screens are
      # identical across environments (see local-dev.md / issue #186).
      - ./deploy/keycloak/keycloak-themes/my-theme:/opt/keycloak/themes/my-theme
      - ./deploy/keycloak/import:/opt/keycloak/data/import
