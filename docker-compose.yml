version: '3.8'

services:
  exam-dotnet-api:
    container_name: exam-dotnet-api
    build:
      context: ./dockerfiles/api
      dockerfile: Dockerfile.api
    ports:
      - '8005:8005'
      - '5079:5079'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8005
      # Jitsi self-host (issue #97). Browser talks to jitsi-web directly at
      # PublicBaseUrl, not through the container network — this is only used
      # by the API to generate the meeting URL + sign the JWT.
      - Video__Jitsi__PublicBaseUrl=${JITSI_PUBLIC_URL}
      - Video__Jitsi__AppId=${JITSI_JWT_APP_ID}
      - Video__Jitsi__AppSecret=${JITSI_JWT_APP_SECRET:?JITSI_JWT_APP_SECRET .env icinde tanimli olmali}
      - Video__Jitsi__RoomSecret=${JITSI_ROOM_SECRET:?JITSI_ROOM_SECRET .env icinde tanimli olmali}
    volumes:
      - ./api:/app
    depends_on:
      exam-pg-container:
        condition: service_healthy
    networks:
      - mynetwork

  auth-api:
    container_name: auth-api
    build:
      context: ./dockerfiles/auth-api
      dockerfile: Dockerfile.auth-api
    ports:
      - '9005:8005'
      - '6079:5079'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8005
    volumes:
      - ./auth-api:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
    networks:
      - mynetwork

  exam-badge-api:
    container_name: exam-badge-api
    build:
      context: ./dockerfiles/badge
      dockerfile: Dockerfile.badge
    ports:
      - '8006:8006'
      - '5080:5080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8006
    volumes:
      - ./Services/BadgeService:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
    networks:
      - mynetwork

  exam-outbox-publisher:
    container_name: exam-outbox-publisher
    build:
      context: ./dockerfiles/outboxpub
      dockerfile: Dockerfile.outboxpub
    ports:
      - '8007:8007'
      - '5081:5081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8007
    volumes:
      - ./Services/OutboxPublisher:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
    networks:
      - mynetwork

  # Second, independent instance of the same OutboxPublisher code, pointed at
  # auth-api's identity DB instead of the worksheet DB (see issue #84).
  # OutboxProcessor.cs/Program.cs are unchanged — only the connection strings
  # below differ from exam-outbox-publisher's.
  identity-outbox-publisher:
    container_name: identity-outbox-publisher
    build:
      context: ./dockerfiles/outboxpub
      dockerfile: Dockerfile.outboxpub
    ports:
      - '8008:8008'
      - '5082:5082'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8008
      # Same host (exam_pg_container) as exam-outbox-publisher, but the
      # "identity" database — matches auth-api's ConnectionStrings:DefaultConnection.
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./Services/OutboxPublisher:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mynetwork

  angular-app:
    container_name: angular-app
    build:
      context: ./dockerfiles/ui
      dockerfile: Dockerfile.ui
    image: exam-angular:latest
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
    depends_on:
      - exam-dotnet-api
    networks:
      - mynetwork
    volumes:
      - ./ui:/app

  auth-ui:
    container_name: auth-ui
    build:
      context: ./dockerfiles/auth-ui
      dockerfile: Dockerfile.auth-ui
    image: auth-ui:latest
    ports:
      - '4201:4200'
    environment:
      - NODE_ENV=development
    depends_on:
      - auth-api
    networks:
      - mynetwork
    volumes:
      - ./auth-ui:/app

  exam-pg-container:
    container_name: exam_pg_container
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - ./postgres/examdata:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '5051:80'
    depends_on:
      exam-pg-container:
        condition: service_healthy
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - mynetwork

  # nginx:
  #   build:
  #     context: ./dockerfiles/nginx
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - exam-dotnet-api
  #     - angular-app
  #   networks:
  #     - mynetwork
  #   volumes:
  #     - ./dockerfiles/nginx/nginx.conf:/etc/nginx/nginx.conf

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - '9000:9000' # MinIO API Portu
      - '9001:9001' # MinIO Yönetim Paneli
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    networks:
      - mynetwork

  question-detector-dev:
    container_name: question-detector-dev
    build:
      context: .
      dockerfile: question-detector/Dockerfile
    volumes:
      - ./question-detector:/app
    working_dir: /app
    tty: true
    stdin_open: true
    ports:
      - '8888:8888' # Jupyter Notebook veya diğer servisler için hazır
      - '8080:8080' # FastAPI veya diğer servisler için hazır
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - mynetwork

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672' # AMQP portu (backend ile iletişim)
      - '15672:15672' # Yönetim paneli (browser'dan erişim için)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    networks:
      - mynetwork

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: exam_pg_container
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_PROXY: none
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT:  8081
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ACCESS_LOG_ENABLED: "true" # Hatayı yapan isteği görmek için
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      exam-pg-container:
        condition: service_healthy      
    networks:
      - mynetwork

