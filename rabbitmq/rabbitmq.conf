# Issue #279 item 1 — load per-service users/vhost permissions from
# definitions.json on node boot instead of the single shared
# RABBITMQ_DEFAULT_USER/PASS admin account every service used to share.
#
# management.load_definitions only imports on a FRESH node (empty Mnesia
# database under ./rabbitmq/data) — see .claude/rules/local-dev.md for the
# migration note on existing local RabbitMQ volumes.
management.load_definitions = /etc/rabbitmq/definitions.json
