name: assistant-golden

# Issue #509: the assistant's golden scenario set against the real model (tests/AssistantService.Tests/Golden).
# Paid (≈ 0.01 USD per run with Haiku + a Sonnet judge), so not in tests.yml: by hand, and on PRs that change the
# prompt, tools or guide. Not a required check. Without the ASSISTANT_GOLDEN_API_KEY secret the test skips (green).
# The report goes to the job summary; nothing is uploaded unless the run fails (Actions storage quota).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scenario ids, comma-separated (empty = all)"
        required: false
      model:
        description: "Assistant model (empty = the service default)"
        required: false
  pull_request:
    branches: [master]
    paths:
      - "Services/AssistantService/Chat/**"
      - "Services/AssistantService/Tools/**"
      - "Services/AssistantService/Help/**"
      - "tests/AssistantService.Tests/Golden/**"

permissions:
  contents: read

concurrency:
  group: assistant-golden-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  golden:
    name: golden
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Golden set
        run: dotnet test tests/AssistantService.Tests -c Release --filter "Category=Golden" --logger "console;verbosity=normal"
        env:
          ASSISTANT_GOLDEN_API_KEY: ${{ secrets.ASSISTANT_GOLDEN_API_KEY }}
          ASSISTANT_GOLDEN_ONLY: ${{ inputs.only }}
          ASSISTANT_GOLDEN_MODEL: ${{ inputs.model }}
          ASSISTANT_GOLDEN_REPORT: ${{ runner.temp }}/golden-report.md
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/golden-report.md" ]; then cat "$RUNNER_TEMP/golden-report.md" >> "$GITHUB_STEP_SUMMARY";
          else echo "Golden set skipped (no ASSISTANT_GOLDEN_API_KEY secret) or did not run." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report (failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-report
          path: ${{ runner.temp }}/golden-report.md
          retention-days: 3
