<svg class="ink" *transloco="let t; prefix: 'test-solve.ink'" [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight()"
  preserveAspectRatio="xMinYMin meet" [attr.role]="active() ? 'img' : null"
  [attr.aria-label]="active() ? t('drawingAria') : null" [attr.aria-hidden]="active() ? null : 'true'"
  (pointerdown)="startStroke($event)" (pointermove)="extendStroke($event)" (pointerup)="endStroke($event)"
  (pointercancel)="endStroke($event)" (lostpointercapture)="endStroke($event)">
  @for (stroke of strokes(); track $index) {
    <path class="ink__stroke" [attr.d]="strokePath(stroke)" [style.stroke]="strokeCss(stroke)" />
  }
  @if (currentStroke(); as stroke) {
    <path class="ink__stroke" [attr.d]="stroke" [style.stroke]="currentCss()" />
  }
</svg>
