<div class="lp" *transloco="let t; prefix: 'landing'">
  <app-navbar />
  <main>
    <app-landing-hero />
    <app-landing-stats />
    <app-landing-roles />
    <app-landing-features />

    <app-landing-spotlight anchor="ogretmenler" section="teachers" kickerIcon="co_present" [itemCount]="4" [alt]="true"
      [ctaUrl]="registerTeacherUrl">
      <img src="assets/images/landing/detect.svg" width="600" height="440" loading="lazy" [alt]="t('teachers.imageAlt')" />
    </app-landing-spotlight>

    <app-landing-spotlight anchor="ogrenciler" section="students" kickerIcon="backpack" [itemCount]="3" [flip]="true"
      [ctaUrl]="registerStudentUrl">
      <div class="art-stack">
        <div class="frame">
          <div class="frame-bar" aria-hidden="true"><i></i><i></i><i></i></div>
          <img src="assets/images/landing/test-solve.png" width="1440" height="860" loading="lazy" decoding="async" [alt]="t('students.imageAlt')" />
        </div>
        <div class="chip-float cf-1"><div>{{ t('students.chips.resultLabel') }}<strong>{{ t('students.chips.resultValue') }}</strong></div></div>
        <div class="chip-float cf-2"><div>{{ t('students.chips.retryLabel') }}<strong>{{ t('students.chips.retryValue') }}</strong></div></div>
      </div>
    </app-landing-spotlight>

    <app-landing-spotlight anchor="motivasyon" section="motivation" kickerIcon="military_tech" [itemCount]="3" [alt]="true">
      <img src="assets/images/landing/motivation.svg" width="560" height="420" loading="lazy" [alt]="t('motivation.imageAlt')" />
    </app-landing-spotlight>

    <app-landing-spotlight anchor="ozel-ders" section="tutoring" kickerIcon="video_chat" [itemCount]="3" [flip]="true"
      [ctaUrl]="registerStudentUrl" [showFootnote]="true">
      <img src="assets/images/landing/tutor.svg" width="600" height="440" loading="lazy" [alt]="t('tutoring.imageAlt')" />
    </app-landing-spotlight>

    <app-how-it-works />
    <app-landing-subjects />
    <app-landing-testimonials />
    <app-faq />
    <app-landing-cta />
  </main>
  <app-landing-footer />

  @if (showBackToTop()) {
    <button mat-mini-fab type="button" class="back-to-top" [attr.aria-label]="t('common.backToTop')" (click)="scrollToTop()">
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">arrow_upward</mat-icon>
    </button>
  }
</div>
