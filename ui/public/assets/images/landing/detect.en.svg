<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="t d">
  <title id="t">Automatic question detection</title>
  <desc id="d">Questions, options and a passage marked with boxes on a scanned book page; an arrow turns them into a digital question card with an AI subject and topic suggestion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6E1FA"/>
      <stop offset="1" stop-color="#D9F1FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#130F25" flood-opacity=".18"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4A33D1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="50" fill="#FFFFFF" opacity=".45"/>
  <circle cx="84" cy="376" r="44" fill="#FFFFFF" opacity=".45"/>

  <!-- scanned page -->
  <g filter="url(#sh)" transform="rotate(-3 170 220)">
    <rect x="40" y="46" width="262" height="350" rx="6" fill="#FFFEFA"/>
    <!-- page header -->
    <rect x="62" y="66" width="90" height="7" rx="3.5" fill="#B7B2DE"/>
    <text x="262" y="74" font-family="Inter, 'Segoe UI', sans-serif" font-size="10" fill="#8A88A6">p. 42</text>
    <!-- passage -->
    <rect x="58" y="88" width="226" height="64" rx="6" fill="#D5FAF5" fill-opacity=".55" stroke="#00A894" stroke-width="2" stroke-dasharray="6 4"/>
    <g fill="#8B90C1"><rect x="68" y="100" width="196" height="5" rx="2.5"/><rect x="68" y="112" width="206" height="5" rx="2.5"/><rect x="68" y="124" width="180" height="5" rx="2.5"/><rect x="68" y="136" width="120" height="5" rx="2.5"/></g>
    <rect x="236" y="80" width="46" height="16" rx="8" fill="#00A894"/>
    <text x="244" y="91.5" font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fff">Text</text>
    <!-- question 1 -->
    <rect x="58" y="166" width="226" height="40" rx="6" fill="#1C43FE" fill-opacity=".07" stroke="#1C43FE" stroke-width="2" stroke-dasharray="6 4"/>
    <g fill="#5C5A78"><rect x="68" y="178" width="200" height="5" rx="2.5"/><rect x="68" y="190" width="150" height="5" rx="2.5"/></g>
    <rect x="230" y="158" width="52" height="16" rx="8" fill="#1C43FE"/>
    <text x="238" y="169.5" font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fff">Q 1</text>
    <!-- options 1 -->
    <g stroke="#FE3F10" stroke-width="1.6" stroke-dasharray="4 3" fill="#FE3F10" fill-opacity=".06">
      <rect x="60" y="214" width="108" height="20" rx="4"/><rect x="176" y="214" width="108" height="20" rx="4"/>
      <rect x="60" y="240" width="108" height="20" rx="4"/><rect x="176" y="240" width="108" height="20" rx="4"/>
    </g>
    <g fill="#8B90C1"><rect x="70" y="221" width="70" height="5" rx="2.5"/><rect x="186" y="221" width="60" height="5" rx="2.5"/><rect x="70" y="247" width="56" height="5" rx="2.5"/><rect x="186" y="247" width="76" height="5" rx="2.5"/></g>
    <!-- question 2 -->
    <rect x="58" y="276" width="226" height="40" rx="6" fill="#1C43FE" fill-opacity=".07" stroke="#1C43FE" stroke-width="2" stroke-dasharray="6 4"/>
    <g fill="#5C5A78"><rect x="68" y="288" width="190" height="5" rx="2.5"/><rect x="68" y="300" width="120" height="5" rx="2.5"/></g>
    <rect x="230" y="268" width="52" height="16" rx="8" fill="#1C43FE"/>
    <text x="238" y="279.5" font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fff">Q 2</text>
    <g stroke="#FE3F10" stroke-width="1.6" stroke-dasharray="4 3" fill="#FE3F10" fill-opacity=".06">
      <rect x="60" y="324" width="108" height="20" rx="4"/><rect x="176" y="324" width="108" height="20" rx="4"/>
      <rect x="60" y="350" width="108" height="20" rx="4"/><rect x="176" y="350" width="108" height="20" rx="4"/>
    </g>
    <rect x="114" y="372" width="34" height="14" rx="7" fill="#FE3F10"/>
    <text x="120" y="382" font-family="Inter, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#fff">Opt.</text>
  </g>

  <!-- scan beam -->
  <rect x="34" y="196" width="282" height="3" rx="1.5" fill="#1C43FE" opacity=".55" transform="rotate(-3 170 220)"/>

  <!-- arrow -->
  <path d="M316 214 C 340 190, 352 190, 372 204" stroke="#4A33D1" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ah)"/>
  <g transform="translate(322 150)">
    <rect width="84" height="26" rx="13" fill="#4A33D1"/>
    <path d="M14 13l3-7 3 7 7 3-7 3-3 7-3-7-7-3z" fill="#FFD262" transform="translate(-2 -3) scale(.85)"/>
    <text x="30" y="17.5" font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fff">Scan</text>
  </g>

  <!-- digital question card -->
  <g filter="url(#sh)">
    <rect x="384" y="96" width="196" height="268" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="402" y="126" font-family="Inter, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#5C5A78" letter-spacing=".4">Q1 · MULTIPLE CHOICE</text>
  <g fill="#3E3B5C"><rect x="402" y="140" width="160" height="6" rx="3"/><rect x="402" y="152" width="118" height="6" rx="3"/></g>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="11" font-weight="700">
    <rect x="402" y="170" width="160" height="22" rx="6" fill="#F5F4FB" stroke="#D8D5EC"/><text x="410" y="185" fill="#5C5A78">A</text><rect x="424" y="178" width="70" height="5" rx="2.5" fill="#B7B2DE"/>
    <rect x="402" y="198" width="160" height="22" rx="6" fill="#D3F7E6" stroke="#009E52"/><text x="410" y="213" fill="#007C3A">B</text><rect x="424" y="206" width="84" height="5" rx="2.5" fill="#02BB71"/>
    <rect x="402" y="226" width="160" height="22" rx="6" fill="#F5F4FB" stroke="#D8D5EC"/><text x="410" y="241" fill="#5C5A78">C</text><rect x="424" y="234" width="60" height="5" rx="2.5" fill="#B7B2DE"/>
    <rect x="402" y="254" width="160" height="22" rx="6" fill="#F5F4FB" stroke="#D8D5EC"/><text x="410" y="269" fill="#5C5A78">D</text><rect x="424" y="262" width="76" height="5" rx="2.5" fill="#B7B2DE"/>
  </g>
  <!-- AI classification -->
  <rect x="402" y="290" width="160" height="56" rx="10" fill="#E6E1FA"/>
  <path d="M414 300l2.2-5 2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2z" fill="#4A33D1"/>
  <text x="428" y="306" font-family="Inter, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#2A1A8F">AI suggestion</text>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">
    <rect x="410" y="316" width="58" height="20" rx="10" fill="#FFFFFF"/><text x="418" y="329.5" fill="#211D3A">Maths</text>
    <rect x="472" y="316" width="44" height="20" rx="10" fill="#FFFFFF"/><text x="479" y="329.5" fill="#211D3A">Fraction</text>
    <rect x="520" y="316" width="36" height="20" rx="10" fill="#FFF4D6"/><text x="526" y="329.5" fill="#8A6100">Mid</text>
  </g>

  <!-- saved chip -->
  <g filter="url(#sh)" transform="translate(410 378)">
    <rect width="150" height="36" rx="18" fill="#1C43FE"/>
    <circle cx="20" cy="18" r="9" fill="#FFFFFF"/>
    <path d="M16 18l3 3 5-6" stroke="#1C43FE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="22.5" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fff">Saved to test</text>
  </g>
</svg>
