<div class="pagination-container" *transloco="let t; prefix: 'shared.pagination'">
  <!-- Prev -->
  <button class="pagination-button prev" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
    {{ t('previous') }}
  </button>

  <!-- Sayfa Numaraları -->
  @for (page of visiblePages; track page) {
    <button
      class="pagination-button"
      [class.active]="page === currentPage"
      [disabled]="page < 0"
    (click)="
      page > 0 ? changePage(page) :
      page === -1 ? skipLeft() :
      page === -2 ? skipRight() : null">
      @if (page > 0) {
        {{ page }}
      }
      @if (page === -1) {
        ...
      }
      @if (page === -2) {
        ...
      }
    </button>
  }

  <!-- Next -->
  <button class="pagination-button next" [disabled]="currentPage >= totalPages" (click)="changePage(currentPage + 1)">
    {{ t('next') }}
  </button>
</div>
