<section class="sec alt" id="sss" *transloco="let t; prefix: 'landing'">
  <div class="wrap">
    <div class="sec-head">
      <span class="kicker">{{ t('faq.kicker') }}</span>
      <h2>{{ t('faq.title') }}</h2>
    </div>
    <mat-accordion class="faq">
      @for (key of keys; track key; let first = $first) {
        <mat-expansion-panel [expanded]="first">
          <mat-expansion-panel-header>
            <mat-panel-title>{{ t('faq.items.' + key + '.question') }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p>{{ t('faq.items.' + key + '.answer') }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</section>
