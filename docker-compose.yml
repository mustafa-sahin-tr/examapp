version: '3.8'

services:
  exam-dotnet-api:
    container_name: exam-dotnet-api
    build:
      context: ./dockerfiles/api
      dockerfile: Dockerfile.api
    ports:
      - '8005:8005'
      - '5079:5079'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8005
      # Issue #238: appsettings.json artık Postgres/MinIO/Keycloak secret'larını
      # düz metin tutmuyor — hepsi .env'den gelir.
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=worksheet;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - MinioConfig__AccessKey=${MINIO_ROOT_USER}
      - MinioConfig__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET .env icinde tanimli olmali}
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET .env icinde tanimli olmali}
      # Issue #228: Redis parolası appsettings.json'da tutulmaz; .env'deki
      # REDIS_PASSWORD'dan (redis servisinin --requirepass'i ile aynı) gelir.
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD .env icinde tanimli olmali}
      # Jitsi self-host (issue #97). Browser talks to jitsi-web directly at
      # PublicBaseUrl, not through the container network — this is only used
      # by the API to generate the meeting URL + sign the JWT.
      - Video__Jitsi__PublicBaseUrl=${JITSI_PUBLIC_URL}
      - Video__Jitsi__AppId=${JITSI_JWT_APP_ID}
      - Video__Jitsi__AppSecret=${JITSI_JWT_APP_SECRET:?JITSI_JWT_APP_SECRET .env icinde tanimli olmali}
      - Video__Jitsi__RoomSecret=${JITSI_ROOM_SECRET:?JITSI_ROOM_SECRET .env icinde tanimli olmali}
      # Issue #225: exam API artık RabbitMQ consumer'ı barındırıyor (kuyruk "exam-api":
      # BadgeService'in StudentPointsChangedEvent'i → StudentPoints). Host yoksa bus kurulmaz.
      # Issue #279: paylaşılan RABBITMQ_DEFAULT_USER/PASS admin hesabı yerine servise özel,
      # en az yetkili kullanıcı — bkz. rabbitmq/definitions.json (yalnız "exam-api" kuyruğunu
      # okuyabilir, yalnız StudentPointsChangedEvent exchange'ine configure/write yapabilir).
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=exam_api
      - RabbitMQ__Password=${RABBITMQ_EXAM_API_PASSWORD:?RABBITMQ_EXAM_API_PASSWORD .env icinde tanimli olmali}
    volumes:
      - ./api:/app
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mynetwork

  auth-api:
    container_name: auth-api
    build:
      context: ./dockerfiles/auth-api
      dockerfile: Dockerfile.auth-api
    # Issue #100: host portu yalnızca 127.0.0.1'e publish edilir — LAN'dan gateway'i atlayıp
    # sahte X-Forwarded-For ile IP rate limit'ini delmek mümkün olmasın. Container içi erişim
    # (gateway/exam-api/badge → auth-api:5079) etkilenmez. Eski '9005:8005' HTTPS mapping'i
    # kaldırıldı: Program.cs ConfigureKestrel ile yalnızca Kestrel:Port'u (5079) dinliyor,
    # 8005'te hiçbir şey yoktu.
    ports:
      - '127.0.0.1:6079:5079'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # XFF yalnızca gateway'den gelirse uygulansın: ocelot-gateway'e sabit IP verildiğinde
      # (aşağıdaki networks/ipam ve ocelot-gateway ipv4_address örneği) açın:
      # - ForwardedHeaders__KnownProxies__0=172.28.0.10
      # Issue #238: appsettings.json artık Postgres/MinIO/Keycloak secret'larını
      # düz metin tutmuyor — hepsi .env'den gelir.
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - MinioConfig__AccessKey=${MINIO_ROOT_USER}
      - MinioConfig__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET .env icinde tanimli olmali}
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET .env icinde tanimli olmali}
      # Issue #277 (madde 4): auth-api artık RabbitMQ consumer'ı barındırıyor (kuyruk "auth-api":
      # exam API'nin outbox'ından UserRoleChangedEvent → Users.Role). Aynı desen exam-dotnet-api'deki
      # StudentPointsChangedConsumer ile (issue #225). Servise özel, en az yetkili kullanıcı —
      # bkz. rabbitmq/definitions.json (yalnız "auth-api" kuyruğunu okuyabilir, yalnız
      # UserRoleChangedEvent exchange'ine configure/write yapabilir).
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=auth_api
      - RabbitMQ__Password=${RABBITMQ_AUTH_API_PASSWORD:?RABBITMQ_AUTH_API_PASSWORD .env icinde tanimli olmali}
    volumes:
      - ./auth-api:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mynetwork

  exam-badge-api:
    container_name: exam-badge-api
    build:
      context: ./dockerfiles/badge
      dockerfile: Dockerfile.badge
    ports:
      - '8006:8006'
      - '5080:5080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8006
      # Issue #165: BadgeService resolves the caller's numeric user id via
      # GET /api/auth/user-profile on auth-api. Same docker-compose hostname
      # exam-dotnet-api's AuthApiBaseUrl already uses (appsettings.json,
      # "http://auth-api:5079"). BadgeService's appsettings(.Development).json
      # carries the same default; kept explicit here so the compose topology is
      # self-describing and overridable — same pattern as ExamApi__BaseUrl.
      - AuthApi__BaseUrl=http://auth-api:5079
      # Issue #238: appsettings.Development.json artık Postgres/RabbitMQ/MinIO/
      # Keycloak secret'larını düz metin tutmuyor — hepsi .env'den gelir.
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=badge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - MinioConfig__AccessKey=${MINIO_ROOT_USER}
      - MinioConfig__SecretKey=${MINIO_ROOT_PASSWORD}
      # Issue #279: servise özel RabbitMQ kullanıcısı — bkz. rabbitmq/definitions.json
      # (BadgeService "badge-service" kuyruğunu okuyabilir; StudentPointsChangedEvent
      # HARİÇ tüm outbox event exchange'lerine configure/write yapabilir).
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=badge_service
      - RabbitMQ__Password=${RABBITMQ_BADGE_SERVICE_PASSWORD:?RABBITMQ_BADGE_SERVICE_PASSWORD .env icinde tanimli olmali}
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET .env icinde tanimli olmali}
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET .env icinde tanimli olmali}
    volumes:
      - ./Services/BadgeService:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      auth-api:
        condition: service_started
    networks:
      - mynetwork

  exam-outbox-publisher:
    container_name: exam-outbox-publisher
    build:
      context: ./dockerfiles/outboxpub
      dockerfile: Dockerfile.outboxpub
    ports:
      - '8007:8007'
      - '5081:5081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8007
      # Issue #279: servise özel RabbitMQ kullanıcısı — bkz. rabbitmq/definitions.json
      # (worksheet DB'nin outbox'ından yalnız o event tipi exchange'lerine
      # configure/write; kuyruğu yok, hiçbir şey okumaz). Daha önce bu üç env var
      # burada eksikti (RabbitMQ:Host boş kalıyordu) — servise özel kimlik bilgisi
      # eklerken diğer iki publisher'la aynı şekle getirildi.
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=exam_outbox_pub
      - RabbitMQ__Password=${RABBITMQ_EXAM_OUTBOX_PASSWORD:?RABBITMQ_EXAM_OUTBOX_PASSWORD .env icinde tanimli olmali}
    volumes:
      - ./Services/OutboxPublisher:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mynetwork

  # Second, independent instance of the same OutboxPublisher code, pointed at
  # auth-api's identity DB instead of the worksheet DB (see issue #84).
  # OutboxProcessor.cs/Program.cs are unchanged — only the connection strings
  # below differ from exam-outbox-publisher's.
  identity-outbox-publisher:
    container_name: identity-outbox-publisher
    build:
      context: ./dockerfiles/outboxpub
      dockerfile: Dockerfile.outboxpub
    ports:
      - '8008:8008'
      - '5082:5082'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8008
      # Same host (exam_pg_container) as exam-outbox-publisher, but the
      # "identity" database — matches auth-api's ConnectionStrings:DefaultConnection.
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Issue #279: servise özel RabbitMQ kullanıcısı — bkz. rabbitmq/definitions.json
      # (identity DB'nin outbox'ından yalnız LoginAttemptedEvent/UserPreferredLocaleChangedEvent
      # exchange'lerine configure/write; kuyruğu yok, hiçbir şey okumaz).
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=identity_outbox_pub
      - RabbitMQ__Password=${RABBITMQ_IDENTITY_OUTBOX_PASSWORD:?RABBITMQ_IDENTITY_OUTBOX_PASSWORD .env icinde tanimli olmali}
    volumes:
      - ./Services/OutboxPublisher:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mynetwork

  # Third instance of the same OutboxPublisher code (issue #225), pointed at
  # BadgeService's "badge" DB: BadgeService writes StudentPointsChangedEvent to
  # its own OutboxMessages table in the same SaveChanges as the aggregate, and
  # this relay publishes it to RabbitMQ for exam-dotnet-api's "exam-api" queue.
  badge-outbox-publisher:
    container_name: badge-outbox-publisher
    build:
      context: ./dockerfiles/outboxpub
      dockerfile: Dockerfile.outboxpub
    ports:
      - '8009:8009'
      - '5083:5083'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8009
      - ConnectionStrings__DefaultConnection=Host=exam_pg_container;Port=5432;Database=badge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Issue #279: servise özel RabbitMQ kullanıcısı — bkz. rabbitmq/definitions.json
      # (badge DB'nin outbox'ından yalnız StudentPointsChangedEvent exchange'ine
      # configure/write yapabilen TEK kullanıcı — sahte StudentPointsChangedEvent riski
      # bununla kapanır). Kuyruğu yok, hiçbir şey okumaz.
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=badge_outbox_pub
      - RabbitMQ__Password=${RABBITMQ_BADGE_OUTBOX_PASSWORD:?RABBITMQ_BADGE_OUTBOX_PASSWORD .env icinde tanimli olmali}
    volumes:
      - ./Services/OutboxPublisher:/app
      - ./api/ExamApp.Foundation:/api/ExamApp.Foundation
    depends_on:
      exam-pg-container:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      exam-badge-api:
        condition: service_started
    networks:
      - mynetwork

  angular-app:
    container_name: angular-app
    build:
      context: ./dockerfiles/ui
      dockerfile: Dockerfile.ui
    image: exam-angular:latest
    ports:
      - '4200:4200'
    environment:
      - NODE_ENV=development
    depends_on:
      - exam-dotnet-api
    networks:
      - mynetwork
    volumes:
      - ./ui:/app

  auth-ui:
    container_name: auth-ui
    build:
      context: ./dockerfiles/auth-ui
      dockerfile: Dockerfile.auth-ui
    image: auth-ui:latest
    ports:
      - '4201:4200'
    environment:
      - NODE_ENV=development
    depends_on:
      - auth-api
    networks:
      - mynetwork
    volumes:
      - ./auth-ui:/app

  exam-pg-container:
    container_name: exam_pg_container
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - ./postgres/examdata:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '5051:80'
    depends_on:
      exam-pg-container:
        condition: service_healthy
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    networks:
      - mynetwork

  # nginx:
  #   build:
  #     context: ./dockerfiles/nginx
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - exam-dotnet-api
  #     - angular-app
  #   networks:
  #     - mynetwork
  #   volumes:
  #     - ./dockerfiles/nginx/nginx.conf:/etc/nginx/nginx.conf

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - '9000:9000' # MinIO API Portu
      - '9001:9001' # MinIO Yönetim Paneli
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    networks:
      - mynetwork

  question-detector-dev:
    container_name: question-detector-dev
    build:
      context: .
      dockerfile: question-detector/Dockerfile
    volumes:
      - ./question-detector:/app
    working_dir: /app
    tty: true
    stdin_open: true
    ports:
      - '8888:8888' # Jupyter Notebook veya diğer servisler için hazır
      - '8080:8080' # FastAPI veya diğer servisler için hazır
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - mynetwork

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      # Issue #279: yalnızca 127.0.0.1'e publish edilir — LAN'dan AMQP/yönetim
      # arayüzüne erişilip per-service kullanıcı parolalarının brute-force
      # edilmesi/keşfedilmesi mümkün olmasın (bkz. auth-api'nin #100'deki aynı
      # deseni, docker-compose.yml'de auth-api servisi).
      - '127.0.0.1:5672:5672' # AMQP portu (backend ile iletişim)
      - '127.0.0.1:15672:15672' # Yönetim paneli (browser'dan erişim için)
    # Issue #279: RABBITMQ_DEFAULT_USER/PASS artık yalnızca dokümantasyon amaçlı —
    # rabbitmq.conf'taki management.load_definitions devrede olduğu için resmi
    # rabbitmq imajı bu iki env var'ı YOK SAYAR (definitions.json zaten "rabbituser"
    # adminini + her serviste ayrı, en az yetkili kullanıcıyı tanımlıyor, bkz.
    # rabbitmq/definitions.json). .env'de RABBITMQ_DEFAULT_USER/PASS hâlâ tanımlı
    # kalmalı: definitions.json'daki "rabbituser" parolasıyla eşleşmesi gerekiyor
    # (değiştirirsen ikisini birden değiştir + rabbitmq/generate-password-hashes.py
    # ile yeni password_hash'i üret — bkz. .claude/rules/local-dev.md).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - mynetwork

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: exam_pg_container
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_PROXY: none
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT:  8081
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ACCESS_LOG_ENABLED: "true" # Hatayı yapan isteği görmek için
    ports:
      - '127.0.0.1:8081:8080'
    depends_on:
      exam-pg-container:
        condition: service_healthy      
    networks:
      - mynetwork

  # kong:
  #   image: kong/kong-gateway:3.6
  #   container_name: kong
