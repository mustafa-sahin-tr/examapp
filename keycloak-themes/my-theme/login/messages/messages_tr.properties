# Turkish overrides for the login theme.
#
# Keycloak's stock keycloak.v2 theme already ships a full Turkish translation
# (messages_tr.properties in the base theme), which this file is merged on top
# of. Only add keys here that you want to reword for ExamApp's tone/branding.
#
# Full key list: keycloak/themes/base/login/messages/messages_en.properties
# (in the Keycloak distribution / container).

# Encoding must be declared for non-ASCII values.

