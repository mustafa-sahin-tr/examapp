<div class="student-register" *transloco="let t; prefix: 'register'">
  <h2>{{ t('teacher.title') }}</h2>

  <form [formGroup]="teacherForm" (ngSubmit)="submitForm()">
    <mat-form-field appearance="outline">
      <mat-label>{{ t('fields.schoolName') }}</mat-label>
      <input matInput type="text" formControlName="schoolName" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting() || teacherForm.invalid">
      {{ isSubmitting() ? t('actions.saving') : t('actions.save') }}
    </button>
  </form>
</div>
