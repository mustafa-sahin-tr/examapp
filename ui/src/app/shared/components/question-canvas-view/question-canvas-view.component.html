<div class="canvas-container">
  <canvas #passagecanvas></canvas>
  <canvas #canvas (mousemove)="onMouseMove($event)" (click)="selectChoice($event)"></canvas>
</div>

@if (isPreviewMode) {
  <div class="qcv-actions">
    <div class="qcv-zoom" role="group" aria-label="Yakınlaştırma">
      <button type="button" class="qcv-zoom__btn" (click)="shrinkImage()" aria-label="Küçült (-5%)">
        <mat-icon>remove</mat-icon>
      </button>
      <span class="qcv-zoom__val">%{{ zoomPercent }}</span>
      <button type="button" class="qcv-zoom__btn" (click)="enlargeImage()" aria-label="Büyüt (+5%)">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <button type="button" class="qcv-btn qcv-btn--primary" (click)="applyClassificationToQuestion()">
      <mat-icon>check</mat-icon>Uygula
    </button>

    <button type="button" class="qcv-btn qcv-btn--danger" (click)="removeQuestion()">
      <mat-icon>delete</mat-icon>Soruyu Testten Çıkar
    </button>
  </div>
}

<div class="qcv-result">
  @if (_questionRegion() && _questionRegion().isExample) {
    @if (correctAnswerVisible) {
      <div class="correct-answer">
        <span class="correct-answer__label">Doğru Cevap</span>
        <div class="question-lite-text" [innerHTML]="_questionRegion().exampleAnswer"></div>
      </div>
    }
    <button type="button" class="qcv-btn qcv-btn--ghost qcv-btn--sm" (click)="showCorrectAnswer()">
      Sonucu Gör
    </button>
  }
</div>
