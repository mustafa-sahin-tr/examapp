<ng-container *transloco="let t; prefix: 'worksheet-detail'">
<h2 mat-dialog-title>{{ t('bankDialog.title') }}</h2>

<mat-dialog-content>
  <p class="bqd-desc">{{ t('bankDialog.subtitle') }}</p>

  @if (errorMessage()) {
    <div class="bqd-alert" role="alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  @if (existingIds(); as existing) {
    <app-question-bank-panel [selectable]="true" [disabledIds]="existing" (selectionChange)="onSelectionChange($event)" />
  } @else if (!errorMessage()) {
    <div class="bqd-loading"><mat-spinner diameter="32"></mat-spinner></div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <span class="bqd-count">{{ t('bankDialog.selectedCount', { count: selectedIds().length }) }}</span>
  <button mat-button type="button" (click)="cancel()">{{ t('bankDialog.cancel') }}</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    data-testid="bank-dialog-submit"
    (click)="submit()"
    [disabled]="submitting() || selectedIds().length === 0"
  >
    @if (submitting()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      <span>{{ t('bankDialog.submit') }}</span>
    }
  </button>
</mat-dialog-actions>
</ng-container>
