<div [ngClass]="{ 'container': !previewMode(), 'selection-mode': selectionMode() }">
  <div [ngClass]="{ 'form-container': !previewMode() }">

    <div class="form-column-4" style="border: var(--border-input)">
      <ng-container *ngIf="previewMode()">
        <div class="ms-preview">
          <aside class="ms-preview__nav">
            <div class="ms-preview__card-head"><span class="ins-dot"></span>Sorular</div>
            <app-question-navigator [questions]="previewQuestions"
              (questionSelected)="questionSelected($event)"></app-question-navigator>
          </aside>

          <main class="ms-preview__stage">
            <section class="ms-preview__view">
              <div class="ms-preview__card-head"><span class="ins-dot"></span>Birleşik görünüm</div>
              <app-question-canvas-view [questionRegion]="regions()[previewCurrentIndex()]"
                [currentClassification]="currentClassification()" [isPreviewMode]="true"
                (choiceSelected)="onPreviewChoiceSelected($event)" (questionRemove)="onQuestionRemove($event)"
                (applyClassification)="onApplyClassification($event)"></app-question-canvas-view>
            </section>

            <section class="ms-preview__view">
              <div class="ms-preview__card-head"><span class="ins-dot"></span>Ayrık görünüm — soru + şıklar</div>
              <app-question-canvas-view-v5 [questionRegion]="regions()[previewCurrentIndex()]" [isPreviewMode]="true"
                (questionRemove)="onQuestionRemove($event)"></app-question-canvas-view-v5>
            </section>
          </main>

          <aside class="ms-preview__side">
            <div class="ms-preview__card" *ngIf="previewDifficultyLevel() as level"
              [ngClass]="previewDifficultyTone()">
              <div class="ms-preview__card-head"><span class="ins-dot"></span>Zorluk</div>
              <div class="preview-difficulty-chip__top">
                <span class="preview-difficulty-chip__label">Seviye</span>
                <span class="preview-difficulty-chip__value">{{ level }}/10</span>
              </div>
              <div class="preview-difficulty-chip__bar">
                <span class="preview-difficulty-chip__fill" [style.width.%]="level * 10"></span>
              </div>
            </div>

            <div class="ms-preview__card">
              <div class="ms-preview__card-head"><span class="ins-dot"></span>Sınıflandırma</div>
              <app-classification-selector [initialSelection]="currentClassification()"
                (selectionChange)="onClassificationChange($event)"></app-classification-selector>
            </div>
          </aside>
        </div>
      </ng-container>


      <div *ngIf="!previewMode() && imageSrc()" class="ms-canvas-wrapper">
        <canvas #canvas (mousedown)="startSelection($event)" (click)="tapCorrectAnswer($event)"
          (mousemove)="onMouseMove($event)" (mouseup)="endSelection($event)"
          (contextmenu)="onRightClick($event)"></canvas>
        <!-- Sol bölge – Previous -->
        <div class="ms-nav-area ms-nav-prev" [class.ms-nav-disabled]="isDrawing" (click)="previousImage()"></div>
        <!-- Sağ bölge – Next -->
        <div class="ms-nav-area ms-nav-next" [class.ms-nav-disabled]="isDrawing" (click)="nextImage()"></div>
        <!-- Marker'lar -->
        <div *ngFor="let marker of warningMarkers" [class.cs-warning-marker]="marker.type === 'warning'"
          [class.cs-error-marker]="marker.type === 'error'" [ngStyle]="{ top: marker.y + 'px', left: marker.x + 'px' }"
          (click)="openWarningContextMenu(marker, $event)">
          <mat-icon [style.width]="warningIconHeight + 'px !important'"
            [style.height]="warningIconHeight + 'px !important'" [style.font-size]="warningIconHeight + 'px !important'"
            color="warn">warning</mat-icon>
        </div>
        <!-- Marker context menü -->
        <div *ngIf="warningMenuVisible" class="wr-custom-context-menu"
          [ngStyle]="{ top: warningMenuY + 'px', left: warningMenuX + 'px' }" (click)="$event.stopPropagation()">
          <div style="padding: 8px; max-width: 220px">
            <!-- <strong>Uyarı:</strong> -->
            <ul>
              <li *ngFor="let warningMessage of selectedWarning?.messages">
                <div>{{ warningMessage }}</div>
              </li>
            </ul>
          </div>
          <mat-divider></mat-divider>
          <button (click)="dismissWarning($event)">Uyarıyı Kapat</button>
        </div>
      </div>

      <div *ngIf="contextMenuVisible" (click)="$event.stopPropagation()" class="ms-custom-context-menu"
        [ngStyle]="{ top: contextMenuY + 'px', left: contextMenuX + 'px' }">
        <!-- Region için menü -->
        <ng-container *ngIf="contextMenuType === 'region'">
          <button (click)="handleMenuAction('removeQuestion', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">delete</mat-icon>
            Soru Sil
          </button>
          <button (click)="handleMenuAction('selectAnswerMode', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">crop_square</mat-icon>
            Şık Çiz (MCQ)
          </button>
          <button (click)="handleMenuAction('selectDropZoneMode', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">radio_button_unchecked</mat-icon>
            Zone Çiz (dragDropLabeling)
          </button>

          <!-- dragDropLabeling hızlı ayarları (sağ panel olmadan) -->
          <ng-container *ngIf="
              selectedRegion! >= 0 && getInteractionType(regions()[selectedRegion || 0].name) === 'dragDropLabeling'
            ">
            <mat-divider></mat-divider>
            <div style="padding: 6px 8px; font-size: 12px; opacity: 0.8">dragDropLabeling</div>

            <label style="display: block; padding: 6px 8px 2px; font-size: 12px; opacity: 0.8">Etiket Sayısı</label>
            <input type="number" min="1" max="30" style="margin: 0 8px 6px; width: calc(100% - 16px)"
              [value]="getLabelCount(regions()[selectedRegion || 0].name)" (click)="$event.stopPropagation()"
              (change)="setLabelCount(regions()[selectedRegion || 0].name, $any($event.target).value)" />

            <button (click)="ensureDraggables(regions()[selectedRegion || 0].name)">
              <mat-icon style="vertical-align: middle; margin-right: 8px">format_list_numbered</mat-icon>
              Etiketleri Oluştur
            </button>
            <button (click)="autoAssignSolutionSequential(regions()[selectedRegion || 0].name)">
              <mat-icon style="vertical-align: middle; margin-right: 8px">auto_fix_high</mat-icon>
              Auto Solution
            </button>
          </ng-container>

          <button (click)="handleMenuAction('removeAll', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">delete</mat-icon>
            Tüm Soruları Sil
          </button>
          <button (click)="handleMenuAction('alignAnswers', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">format_align_center</mat-icon>
            Cevapları Hizala
          </button>
          <select *ngIf="selectedRegion! >= 0 && passages().length > 0" id="passageSelect"
            (change)="onPassageChange($event, regions()[selectedRegion || 0].name)" (click)="$event.stopPropagation()">
            <option value="0" [selected]="!selectedPassageMap.has(regions()[selectedRegion || 0].name)">
              🔹 Passage Seçiniz
            </option>
            <option *ngFor="let passage of passages()" [value]="passage.id"
              [selected]="selectedPassageMap.get(regions()[selectedRegion || 0].name) === passage.id">
              Passage {{ passage.id }}
            </option>
          </select>
        </ng-container>

        <!-- Answer için menü -->
        <ng-container *ngIf="contextMenuType === 'answer'">
          <button (click)="handleMenuAction('removeAnswer', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">delete</mat-icon>Seçeneği Sil
          </button>
        </ng-container>

        <!-- DropZone için menü -->
        <ng-container *ngIf="contextMenuType === 'dropzone'">
          <ng-container *ngIf="selectedRegion! >= 0 && selectedDropZoneId as zoneId">
            <div style="padding: 6px 8px; font-size: 12px; opacity: 0.8">Zone: {{ zoneId }}</div>

            <label style="display: block; padding: 6px 8px 2px; font-size: 12px; opacity: 0.8">Etiket Sayısı</label>
            <input type="number" min="1" max="30" style="margin: 0 8px 6px; width: calc(100% - 16px)"
              [value]="getLabelCount(regions()[selectedRegion || 0].name)" (click)="$event.stopPropagation()"
              (change)="setLabelCount(regions()[selectedRegion || 0].name, $any($event.target).value)" />

            <button (click)="ensureDraggables(regions()[selectedRegion || 0].name)">
              <mat-icon style="vertical-align: middle; margin-right: 8px">format_list_numbered</mat-icon>
              Etiketleri Oluştur
            </button>

            <label style="display: block; padding: 6px 8px 2px; font-size: 12px; opacity: 0.8">Doğru Etiket</label>
            <select (click)="$event.stopPropagation()"
              [value]="getZoneAssignedDraggable(regions()[selectedRegion || 0].name, zoneId)"
              (change)="setZoneSolutionFromMenu(regions()[selectedRegion || 0].name, zoneId, $any($event.target).value)">
              <option value="0">(boş)</option>
              <option *ngFor="let d of getDraggables(regions()[selectedRegion || 0].name)" [value]="d.id">
                {{ d.label }}
              </option>
            </select>

            <button (click)="handleMenuAction('removeDropZone', $event)">
              <mat-icon style="vertical-align: middle; margin-right: 8px">delete</mat-icon>
              Zone Sil
            </button>
          </ng-container>
        </ng-container>

        <!-- Passage için menü -->
        <ng-container *ngIf="contextMenuType === 'passage'">
          <div style="padding: 6px 8px; font-size: 12px; opacity: 0.8">Passage: {{ selectedPassageId }}</div>
          <button (click)="handleMenuAction('toggleShowPassageFirst', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">
              {{ isPassageFirstEnabledForPassage(selectedPassageId) ? 'visibility_off' : 'view_agenda' }}
            </mat-icon>
            {{ isPassageFirstEnabledForPassage(selectedPassageId) ? 'Passage önce çıkmasın' : 'Passage önce çıksın' }}
          </button>
          <button (click)="handleMenuAction('removePassage', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">delete</mat-icon>
            Passage Sil
          </button>
        </ng-container>

        <!-- Answer için menü -->
        <ng-container *ngIf="contextMenuType === 'worksheet'">
          <button (click)="handleMenuAction('selectQuestion', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">help_outline</mat-icon>
            Soru Seç
          </button>
          <button (click)="handleMenuAction('predict', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">smart_toy</mat-icon>
            Yapay Zekaya Sor
          </button>
          <button (click)="handleMenuAction('selectPassage', $event)">
            <mat-icon style="vertical-align: middle; margin-right: 8px">assignment</mat-icon>Pasaj Seç
          </button>
        </ng-container>
      </div>
    </div>

  </div>
</div>
