# Issue #279 item 1 — load per-service users/vhost permissions from
# definitions.json on node boot instead of the single shared
# RABBITMQ_DEFAULT_USER/PASS admin account every service used to share.
#
# management.load_definitions runs on EVERY node boot and upserts the users and
# permissions from the file (verified: a narrowed permission is restored by a
# restart); it never deletes objects that are no longer in the file. The catch
# is that a RUNNING node does not re-read the file when it changes - restart
# rabbitmq (compose: rabbitmq-permission-sync re-applies permissions on every
# `up -d`, issue #328, rabbitmq/sync-permissions.sh). See .claude/rules/local-dev.md.
management.load_definitions = /etc/rabbitmq/definitions.json
