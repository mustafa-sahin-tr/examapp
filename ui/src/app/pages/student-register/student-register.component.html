<div class="student-register" *transloco="let t; prefix: 'register'">
  <h2>{{ t('student.title') }}</h2>

  <form [formGroup]="studentForm" (ngSubmit)="submitForm()">
    <mat-form-field appearance="outline">
      <mat-label>{{ t('fields.studentNumber') }}</mat-label>
      <input matInput type="text" formControlName="studentNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ t('fields.schoolName') }}</mat-label>
      <input matInput type="text" formControlName="schoolName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ t('fields.grade') }}</mat-label>
      <mat-select formControlName="gradeId">
        <mat-option [value]="null">{{ t('fields.gradePlaceholder') }}</mat-option>
        @for (grade of grades(); track grade.id) {
          <mat-option [value]="grade.id">{{ grade.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting() || studentForm.invalid">
      {{ isSubmitting() ? t('actions.saving') : t('actions.save') }}
    </button>
  </form>
</div>
