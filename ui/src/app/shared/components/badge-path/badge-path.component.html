@if (layout(); as layout) {
  <div class="ms-single-path" *transloco="let t">
    <div
      class="ms-single-path-track"
      [style.--path-track-height]="layout.height + 'px'"
      [style.--slot-width]="layout.slotPercent + '%'"
    >
      <svg class="ms-single-path-svg" [attr.viewBox]="layout.viewBox" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <!-- Maske yalnız alfa taşır (white = görünür, black = gizli); tema rengi değildir. -->
          <mask [attr.id]="maskId" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
            <rect x="0" y="0" width="100" height="100" fill="white" />
            @for (point of layout.nodePoints; track $index) {
              <circle [attr.cx]="point.xPercent" [attr.cy]="point.yPercent" [attr.r]="layout.maskRadius" fill="black" />
            }
          </mask>
        </defs>

        <g [attr.mask]="'url(#' + maskId + ')'">
          @for (segment of layout.pathSegments; track $index) {
            <path
              class="ms-path-segment"
              [class.ms-path-segment--earned]="segment.status === 'earned'"
              [class.ms-path-segment--next]="segment.status === 'next'"
              [class.ms-path-segment--pending]="segment.status === 'pending'"
              [attr.data-status]="segment.status"
              [attr.d]="segment.path"
              fill="none"
              vector-effect="non-scaling-stroke"
            ></path>
          }
        </g>
      </svg>

      <ol class="ms-single-path-nodes">
        @for (item of items; track item.id; let index = $index) {
          <li
            class="ms-path-item"
            [class.ms-path-item-selected]="selectedId === item.id"
            [style.--node-x]="layout.nodePoints[index].xPercent + '%'"
            [style.--node-y]="layout.nodePoints[index].yPercent + '%'"
          >
            <button
              type="button"
              class="ms-path-node"
              [attr.data-state]="item.state"
              [attr.aria-label]="ariaLabel(t, item)"
              [attr.aria-expanded]="selectedId === item.id"
              [attr.aria-controls]="selectedId === item.id ? detailId + ' ' + detailId + '-inline' : null"
              (click)="selectBadge(item)"
            >
              <app-badge-medallion
                [icon]="item.icon"
                [iconUrl]="item.iconUrl"
                [state]="item.state"
                [size]="64"
                [progressPercent]="item.progressPercent"
              />
              <span class="ms-path-node-text" aria-hidden="true">
                <bdi class="ms-path-node-name" dir="auto">{{ item.name }}</bdi>
                <span class="ms-path-node-progress">{{ stateText(t, item) }}</span>
              </span>
            </button>
            @if (selectedId === item.id) {
              <!-- ≤640px: seçili satır yerinde açılır (masaüstünde gizli, alttaki panel gösterilir) -->
              <app-badge-detail
                class="ms-path-inline-detail"
                [attr.id]="detailId + '-inline'"
                [badge]="item"
                [compact]="true"
              />
            }
          </li>
        }
      </ol>
    </div>

    @if (selectedItem; as selected) {
      <app-badge-detail class="ms-path-detail" [attr.id]="detailId" [badge]="selected" />
    }
  </div>
} @else {
  <div class="ms-single-path-empty" *transloco="let t">
    <span>{{ t('shared.badgePath.empty') }}</span>
  </div>
}
