name: tests

# Issue #416: PR'larda backend + UI testleri. Branch protection bu repoda
# kasıtlı olarak değiştirilmez; hangi check'in required olacağı repo sahibinin kararı.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Kurumsal nexus feed'i CI'da yok; csproj klasörlerindeki nuget.config'ler zaten
  # yalnız api.nuget.org'u gösteriyor (<clear/> + nuget.org), ekstra ayar gerekmez.

jobs:
  # Yalnız doküman / dev script'i değişen PR'larda ağır test işleri atlanır. Workflow'u paths-ignore ile hiç
  # tetiklememek required check'leri (dotnet-unit, integration, ui-tests, auth-ui-tests) sonsuza dek bekletir ve
  # auto-merge kilitlenir; `if:` ile atlanan iş "skipped" raporlanır ve required check'i karşılar.
  # Kod sayılmayanlar: *.md, .claude/**, deploy/scripts/dev-* (dev-only). deploy/scripts'in geri kalanı KOD sayılır:
  # OutboxEventRegistryTests / MinioPresignAccountTests rabbitmq-init.sh ve minio-presign-init.sh'i okuyor.
  # push (master) ve workflow_dispatch'te her zaman tam koşar. gitleaks (scan) ayrı workflow, her zaman koşar.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|.claude/*|deploy/scripts/dev-*) echo "kod değil: $f" ;;
              *) echo "kod: $f"; code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "testler koşacak mı: $code"

  dotnet-unit:
    name: dotnet-unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            tests/Directory.Build.props
      - name: Restore
        run: dotnet restore ExamApp.slnx --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build ExamApp.slnx --no-restore -c Release
      - name: Unit tests (Category=Integration hariç)
        run: dotnet test ExamApp.slnx --no-build -c Release --filter "Category!=Integration"

  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # PO kararı: başta bilgilendirici; stabil olunca kaldırılır.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            tests/Directory.Build.props
      - name: Restore
        run: dotnet restore ExamApp.slnx --source https://api.nuget.org/v3/index.json
      - name: Integration tests (Testcontainers / Postgres)
        run: dotnet test ExamApp.slnx --no-restore -c Release --filter "Category=Integration"

  ui-tests:
    name: ui-tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # dockerfiles/ui ile aynı (node:24); Angular 22: ^22.22.3 || ^24.15
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # npm only (package-lock.json is the single lockfile; same as the prod image and auth-ui-tests).
      - run: npm ci --no-audit --no-fund
      # Vitest browser mode (#545): Playwright drives the runner's system Chrome; no Playwright browser download.
      - run: npx ng test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome

  auth-ui-tests:
    name: auth-ui-tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: auth-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
