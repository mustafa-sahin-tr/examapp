# ExamApp login theme.
#
# Inherits everything from Keycloak's stock keycloak.v2 login theme (all
# templates: login, update-password, update-profile, verify-email, OTP,
# IdP-link, page-expired, logout-confirm, ...). We only layer a brand skin on
# top via brand.css — no .ftl overrides, so Keycloak upgrades don't break us.
parent=keycloak.v2
import=common/keycloak

# styles resolve across the parent chain: styles.css comes from keycloak.v2,
# brand.css from this theme, loaded last so it wins.
styles=css/styles.css css/brand.css

# Single, deliberate look — skip the OS-driven dark variant.
darkMode=false
