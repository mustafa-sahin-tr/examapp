apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: examapp
data:
  init.sql: |
    CREATE DATABASE worksheet_v2;
    CREATE DATABASE auth_db;
    CREATE DATABASE badge;
    CREATE DATABASE keycloak;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: examapp
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: examapp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d postgres
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: examapp
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: examapp
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command:
            - sh
            - -c
            - redis-server --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: examapp
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: examapp
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_PASS
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-init-script
  namespace: examapp
data:
  rabbitmq-init.sh: |
    #!/bin/sh
    # Issue #279 item 1 (prod) — creates/updates the 5 per-service RabbitMQ users
    # and their least-privilege permissions via the management HTTP API. Run as
    # the `rabbitmq-init` one-shot container in deploy/docker-compose.prod.yml
    # (and the equivalent Kubernetes Job in deploy/gcp/k8s/), after the RabbitMQ
    # node is healthy and before any application service starts.
    #
    # Idempotent: PUT /api/users/{user} and PUT /api/permissions/{vhost}/{user}
    # both upsert, so re-running this (every deploy) is safe and converges to the
    # same state — including picking up a rotated *_PASSWORD secret.
    #
    # IMPORTANT: the permission regexes below are the prod mirror of
    # rabbitmq/definitions.json's dev `permissions` block (issue #279's matrix —
    # see .claude/rules/local-dev.md). There is no shared/generated source
    # between the two files; if you add/remove an outbox event or a consumer's
    # subscribed event list, update BOTH by hand.
    set -eu

    : "${RABBITMQ_USER:?RABBITMQ_USER not set}"
    : "${RABBITMQ_PASS:?RABBITMQ_PASS not set}"
    : "${RABBITMQ_EXAM_OUTBOX_PASSWORD:?RABBITMQ_EXAM_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_IDENTITY_OUTBOX_PASSWORD:?RABBITMQ_IDENTITY_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_BADGE_OUTBOX_PASSWORD:?RABBITMQ_BADGE_OUTBOX_PASSWORD not set}"
    : "${RABBITMQ_BADGE_SERVICE_PASSWORD:?RABBITMQ_BADGE_SERVICE_PASSWORD not set}"
    : "${RABBITMQ_EXAM_API_PASSWORD:?RABBITMQ_EXAM_API_PASSWORD not set}"
    : "${RABBITMQ_AUTH_API_PASSWORD:?RABBITMQ_AUTH_API_PASSWORD not set}"

    RABBIT_HOST="${RABBITMQ_HOST:-rabbitmq}"
    RABBIT_URL="http://${RABBIT_HOST}:15672"
    ADMIN_AUTH="${RABBITMQ_USER}:${RABBITMQ_PASS}"
    VHOST="%2F" # "/" URL-encoded

    # Wait for the management API (not just the AMQP port) to answer, since we
    # only talk to :15672 below. docker-compose.prod.yml's rabbitmq-init already
    # waits on `rabbitmq: condition: service_healthy`, but Kubernetes has no
    # equivalent Job-level dependency wait, so this loop is the only thing that
    # makes the Job safe to start immediately alongside the StatefulSet.
    echo "rabbitmq-init: waiting for ${RABBIT_URL}/api/overview ..."
    i=0
    until curl -sf -u "${ADMIN_AUTH}" "${RABBIT_URL}/api/overview" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 60 ]; then
        echo "rabbitmq-init: gave up waiting for RabbitMQ management API after 60 attempts" >&2
        exit 1
      fi
      sleep 2
    done
    echo "rabbitmq-init: RabbitMQ management API is up"

    NS='ExamApp\.Foundation\.Contracts'

    # Publisher event lists (must match OutboxEventRegistry entries actually
    # written by each DB's outbox — see the _comment fields in
    # rabbitmq/definitions.json for the grep-verified source of truth).
    # issue #277: TeacherSchoolRequestSubmittedEvent (item 1) and UserRoleChangedEvent
    # (item 4) added — kept in sync with rabbitmq/definitions.json and
    # deploy/scripts/rabbitmq-init.sh (no shared source between the three, see comment above).
    EXAM_OUTBOX_EVENTS="AnswerSubmittedEvent|QuestionCreatedEvent|WorksheetReminderDueEvent|WorksheetAccessRequestedEvent|WorksheetAccessRequestApprovedEvent|WorksheetAccessRequestRejectedEvent|TeacherApplicationSubmittedEvent|TeacherApplicationDecidedEvent|TeacherSchoolRequestSubmittedEvent|IndependentTeacherRegisteredEvent|BookingRequestCreatedEvent|BookingDecisionEvent|BookingTeacherUnavailableEvent|UserPreferredLocaleChangedEvent|UserRoleChangedEvent|WorksheetCommentCreatedEvent|WorksheetCommentRepliedEvent|WorksheetCommentHiddenEvent|DirectMessageSentEvent|DirectMessageReportedEvent|ParentLinkedEvent|ParentUnlinkedEvent"
    IDENTITY_OUTBOX_EVENTS="LoginAttemptedEvent|UserPreferredLocaleChangedEvent"
    BADGE_OUTBOX_EVENTS="StudentPointsChangedEvent"
    # badge_service consumes everything except StudentPointsChangedEvent and UserRoleChangedEvent
    # (the latter is auth-api's own, issue #277 item 4).
    BADGE_SERVICE_EVENTS="AnswerSubmittedEvent|QuestionCreatedEvent|WorksheetReminderDueEvent|WorksheetAccessRequestedEvent|WorksheetAccessRequestApprovedEvent|WorksheetAccessRequestRejectedEvent|LoginAttemptedEvent|TeacherApplicationSubmittedEvent|TeacherApplicationDecidedEvent|TeacherSchoolRequestSubmittedEvent|IndependentTeacherRegisteredEvent|BookingRequestCreatedEvent|BookingDecisionEvent|BookingTeacherUnavailableEvent|UserPreferredLocaleChangedEvent|WorksheetCommentCreatedEvent|WorksheetCommentRepliedEvent|WorksheetCommentHiddenEvent|DirectMessageSentEvent|DirectMessageReportedEvent"
    EXAM_API_EVENTS="StudentPointsChangedEvent"
    AUTH_API_EVENTS="UserRoleChangedEvent"

    create_user() {
      user="$1"
      pass="$2"
      echo "rabbitmq-init: upserting user '${user}'"
      curl -sf -u "${ADMIN_AUTH}" -X PUT "${RABBIT_URL}/api/users/${user}" \
        -H 'content-type: application/json' \
        -d "{\"password\":\"${pass}\",\"tags\":\"\"}"
    }

    # Consumers must NEVER get "write" on message-type exchanges — that would let
    # them publish/forge the events they're supposed to only consume (the exact
    # risk issue #279 closes). Publishers get write==configure on their message
    # exchanges and no queue (read is empty). Consumers get write scoped to only
    # their own queue/exchange/_error/_skipped; configure+read additionally cover
    # the message exchanges they bind from (RabbitMQ's exchange.bind/queue.bind
    # need read-on-source + write-on-destination — see rabbitmq/definitions.json
    # comments for the full reasoning). PublishFaults is off for every consumer
    # (issue #279, C# side) so no MassTransit.Fault:* exchange access is granted.
    set_perms() {
      user="$1"
      configure="$2"
      write="$3"
      read="$4"
      echo "rabbitmq-init: setting permissions for '${user}'"
      curl -sf -u "${ADMIN_AUTH}" -X PUT "${RABBIT_URL}/api/permissions/${VHOST}/${user}" \
        -H 'content-type: application/json' \
        -d "{\"configure\":\"${configure}\",\"write\":\"${write}\",\"read\":\"${read}\"}"
    }

    # --- Publishers: configure+write on their message exchanges only, no queue ---

    create_user exam_outbox_pub "${RABBITMQ_EXAM_OUTBOX_PASSWORD}"
    set_perms exam_outbox_pub \
      "^${NS}:(${EXAM_OUTBOX_EVENTS})\$" \
      "^${NS}:(${EXAM_OUTBOX_EVENTS})\$" \
      '^$'

    create_user identity_outbox_pub "${RABBITMQ_IDENTITY_OUTBOX_PASSWORD}"
    set_perms identity_outbox_pub \
      "^${NS}:(${IDENTITY_OUTBOX_EVENTS})\$" \
      "^${NS}:(${IDENTITY_OUTBOX_EVENTS})\$" \
      '^$'

    create_user badge_outbox_pub "${RABBITMQ_BADGE_OUTBOX_PASSWORD}"
    set_perms badge_outbox_pub \
      "^${NS}:(${BADGE_OUTBOX_EVENTS})\$" \
      "^${NS}:(${BADGE_OUTBOX_EVENTS})\$" \
      '^$'

    # --- Consumers: write restricted to their own queue/exchange, never a message exchange ---

    create_user badge_service "${RABBITMQ_BADGE_SERVICE_PASSWORD}"
    set_perms badge_service \
      "^(badge-service(_error|_skipped)?|${NS}:(${BADGE_SERVICE_EVENTS}))\$" \
      '^badge-service(_error|_skipped)?$' \
      "^(badge-service(_error|_skipped)?|${NS}:(${BADGE_SERVICE_EVENTS}))\$"

    create_user exam_api "${RABBITMQ_EXAM_API_PASSWORD}"
    set_perms exam_api \
      "^(exam-api(_error|_skipped)?|${NS}:(${EXAM_API_EVENTS}))\$" \
      '^exam-api(_error|_skipped)?$' \
      "^(exam-api(_error|_skipped)?|${NS}:(${EXAM_API_EVENTS}))\$"

    create_user auth_api "${RABBITMQ_AUTH_API_PASSWORD}"
    set_perms auth_api \
      "^(auth-api(_error|_skipped)?|${NS}:(${AUTH_API_EVENTS}))\$" \
      '^auth-api(_error|_skipped)?$' \
      "^(auth-api(_error|_skipped)?|${NS}:(${AUTH_API_EVENTS}))\$"

    echo 'rabbitmq-init: done'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
  namespace: examapp
spec:
  # Issue #279 item 1 — creates the 5 per-service RabbitMQ users + their
  # least-privilege permissions via the management HTTP API (same script as
  # deploy/scripts/rabbitmq-init.sh / docker-compose.prod.yml's rabbitmq-init
  # service). Idempotent, so re-applying this Job on every deploy (e.g. via
  # `kubectl delete job rabbitmq-init --ignore-not-found && kubectl apply -f
  # stateful-services.yaml`, since Jobs are immutable once created) is safe.
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rabbitmq-init
          image: curlimages/curl:8.10.1
          command: ['sh', '/scripts/rabbitmq-init.sh']
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.examapp.svc.cluster.local
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_PASS
            - name: RABBITMQ_EXAM_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_EXAM_OUTBOX_PASSWORD
            - name: RABBITMQ_IDENTITY_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_IDENTITY_OUTBOX_PASSWORD
            - name: RABBITMQ_BADGE_OUTBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_OUTBOX_PASSWORD
            - name: RABBITMQ_BADGE_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_BADGE_SERVICE_PASSWORD
            - name: RABBITMQ_EXAM_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_EXAM_API_PASSWORD
            - name: RABBITMQ_AUTH_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: RABBITMQ_AUTH_API_PASSWORD
          volumeMounts:
            - name: rabbitmq-init-script
              mountPath: /scripts
      volumes:
        - name: rabbitmq-init-script
          configMap:
            name: rabbitmq-init-script
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: examapp
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: examapp
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # RELEASE.2025-09-07T16-13-09Z, pinned by digest (#402 D6)
          command:
            - minio
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: examapp
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: examapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.1
          args:
            - start-dev
            - --http-enabled=true
            - --hostname-strict=false
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres.examapp.svc.cluster.local
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_PROXY
              value: edge
            - name: KC_HEALTH_ENABLED
              value: 'true'
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-presign-init-script
  namespace: examapp
data:
  # Issue #402 (O1) — exact copy of deploy/scripts/minio-presign-init.sh (MinioPresignAccountTests checks that the
  # policy resources here match the exam API's signing allowlist; keep both copies in sync).
  minio-presign-init.sh: |
    #!/bin/sh
    # Issue #402 (O1) — dedicated MinIO account used ONLY to presign browser image URLs.
    #
    # Presigned /img URLs carry the signing access key in X-Amz-Credential. Signing with the MinIO root user leaked the
    # root access key to every signed-in user; this one-shot job creates a separate user whose only right is s3:GetObject
    # on the image prefixes the exam API is allowed to sign (StorageAreaPolicy allowlist). The exam API reads it from
    # MinioConfig:PresignAccessKey / MinioConfig:PresignSecretKey.
    #
    # Runs in the minio/minio image (it ships `mc`; there is no sed/grep/awk in it) with entrypoint sh, as root or as any
    # non-root uid (only a writable TMPDIR is needed).
    # Used by: docker-compose.yml (minio-presign-init), deploy/docker-compose.prod.yml (minio-presign-init),
    # AppHost (minio-presign-init container), and inlined in deploy/gcp/k8s/stateful-services.yaml (minio-presign-init Job).
    # MinioPresignAccountTests checks that the k8s copy is identical to this file and that the policy resources match
    # StorageAreaPolicy — change all of them together.
    #
    # Secrets never appear in argv (visible in /proc/*/cmdline and `ps`): the root connection goes through the
    # MC_HOST_<alias> environment variable, the presign secret through stdin. mc's config dir is a private temp dir
    # removed on exit.
    #
    # Idempotent (safe on every start/deploy): `policy create` overwrites the policy, `user add` on an existing user
    # updates its secret (picks up a rotated MINIO_PRESIGN_SECRET_KEY), attach tolerates "already attached". Afterwards
    # the user must have EXACTLY this one policy and no group memberships, otherwise the job fails.
    # Changing MINIO_PRESIGN_ACCESS_KEY creates a NEW user; remove the old one by hand (deploy/README.md, #402).
    #
    # Env: MINIO_URL (default http://minio:9000), MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_PRESIGN_ACCESS_KEY,
    #      MINIO_PRESIGN_SECRET_KEY, MINIO_QUESTIONS_BUCKET (default exam-questions; same value as the exam API's
    #      MinioConfig:BucketName).
    set -eu

    MINIO_URL="${MINIO_URL:-http://minio:9000}"
    QB="${MINIO_QUESTIONS_BUCKET:-exam-questions}"
    POLICY_NAME="exam-presign-getobject"

    : "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
    : "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    : "${MINIO_PRESIGN_ACCESS_KEY:?MINIO_PRESIGN_ACCESS_KEY is required}"
    : "${MINIO_PRESIGN_SECRET_KEY:?MINIO_PRESIGN_SECRET_KEY is required}"

    if [ "$MINIO_PRESIGN_ACCESS_KEY" = "$MINIO_ROOT_USER" ]; then
      echo "[minio-presign-init] MINIO_PRESIGN_ACCESS_KEY must differ from MINIO_ROOT_USER (the whole point is not to expose root)." >&2
      exit 1
    fi

    WORK_DIR="$(mktemp -d)"
    export MC_CONFIG_DIR="$WORK_DIR/mc"
    trap 'rm -rf "$WORK_DIR"' EXIT INT TERM

    # mc does NOT URL-decode MC_HOST_* and splits the credentials on ':' (session token) — a ':' in the root password
    # cannot be expressed there. In that case only, fall back to `mc alias set` with the keys read from stdin (still not
    # argv; the alias lands in the private MC_CONFIG_DIR above, deleted on exit).
    case "$MINIO_URL" in
      http://*) scheme="http://"; hostport="${MINIO_URL#http://}" ;;
      https://*) scheme="https://"; hostport="${MINIO_URL#https://}" ;;
      *) echo "[minio-presign-init] MINIO_URL must start with http:// or https://" >&2; exit 1 ;;
    esac
    case "$MINIO_ROOT_PASSWORD" in
      *:*) USE_ALIAS=1 ;;
      *) USE_ALIAS=0; export MC_HOST_exam="${scheme}${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${hostport}" ;;
    esac

    connect() {
      if [ "$USE_ALIAS" = 1 ]; then
        printf '%s\n%s\n' "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" | mc alias set exam "$MINIO_URL" >/dev/null 2>&1 || return 1
      fi
      mc admin info exam >/dev/null 2>&1
    }

    # MinIO has no healthcheck in the compose files; wait until the admin API accepts the root credentials.
    attempt=0
    until connect; do
      attempt=$((attempt + 1))
      if [ "$attempt" -ge 60 ]; then
        echo "[minio-presign-init] MinIO at $MINIO_URL not reachable with root credentials after 60 attempts." >&2
        exit 1
      fi
      sleep 2
    done

    POLICY_FILE="$WORK_DIR/policy.json"
    cat > "$POLICY_FILE" <<EOF
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": [
            "arn:aws:s3:::${QB}/questions/*",
            "arn:aws:s3:::${QB}/answers/*",
            "arn:aws:s3:::${QB}/passages/*",
            "arn:aws:s3:::worksheets/*",
            "arn:aws:s3:::exams/*",
            "arn:aws:s3:::study-pages/books/*",
            "arn:aws:s3:::study-pages/pages/*"
          ]
        }
      ]
    }
    EOF

    mc admin policy create exam "$POLICY_NAME" "$POLICY_FILE" >/dev/null
    # Secret via stdin: `mc admin user add TARGET ACCESSKEY` prompts for the secret key when it is not an argument.
    printf '%s\n' "$MINIO_PRESIGN_SECRET_KEY" | mc admin user add exam "$MINIO_PRESIGN_ACCESS_KEY" >/dev/null
    # Re-runs: attaching an already attached policy is an error in newer mc — the verification below decides.
    mc admin policy attach exam "$POLICY_NAME" --user "$MINIO_PRESIGN_ACCESS_KEY" >/dev/null 2>&1 || true

    # The user must have exactly this policy (policyName is a comma-separated list) and belong to no group (a group
    # policy would widen its rights). Matched with `case` because the image has no grep/jq.
    info="$(mc admin user info exam "$MINIO_PRESIGN_ACCESS_KEY" --json)"
    case "$info" in
      *'"status":"success"'*) ;;
      *) echo "[minio-presign-init] could not read user $MINIO_PRESIGN_ACCESS_KEY: $info" >&2; exit 1 ;;
    esac
    case "$info" in
      *"\"policyName\":\"$POLICY_NAME\""*) ;;
      *) echo "[minio-presign-init] $MINIO_PRESIGN_ACCESS_KEY must have exactly the $POLICY_NAME policy: $info" >&2; exit 1 ;;
    esac
    case "$info" in
      *'"memberOf"'*) echo "[minio-presign-init] $MINIO_PRESIGN_ACCESS_KEY must not be a member of any group: $info" >&2; exit 1 ;;
    esac

    echo "[minio-presign-init] presign user $MINIO_PRESIGN_ACCESS_KEY ready (only policy $POLICY_NAME: s3:GetObject on image prefixes, no groups)."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-presign-init
  namespace: examapp
spec:
  # Issue #402 (O1) — creates/updates the GetObject-only MinIO user the exam API presigns image URLs with
  # (MinioConfig__PresignAccessKey/PresignSecretKey in apps.yaml). Idempotent; re-run on every deploy with
  # `kubectl delete job minio-presign-init --ignore-not-found && kubectl apply -f stateful-services.yaml`.
  backoffLimit: 6
  # #402 D8: finished Job (and its pod/logs) is garbage-collected after 1 h; re-apply as above to run it again.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      # #402 D8: the minio/minio image defaults to root, but mc runs fine as any uid with a writable /tmp
      # (the script keeps its mc config in a mktemp dir) — verified with uid 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio-presign-init
          # Same pinned image as the minio StatefulSet: it ships `mc` (minio/mc is not pullable).
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          command: ['sh', '/scripts/minio-presign-init.sh']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          env:
            - name: MINIO_URL
              value: http://minio.examapp.svc.cluster.local:9000
            - name: TMPDIR
              value: /tmp
            - name: MINIO_QUESTIONS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: examapp-config
                  key: MINIO_QUESTIONS_BUCKET
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_PRESIGN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_PRESIGN_ACCESS_KEY
            - name: MINIO_PRESIGN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: examapp-secrets
                  key: MINIO_PRESIGN_SECRET_KEY
          volumeMounts:
            - name: minio-presign-init-script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: minio-presign-init-script
          configMap:
            name: minio-presign-init-script
            defaultMode: 0555
