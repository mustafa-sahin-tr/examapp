<div class="completed-card" *transloco="let t; prefix: 'completed-worksheet.card'">
  <h3>{{ completedTest.name }}</h3>
  <p>{{ t('score', { score: completedTest.score }) }}</p>
  <p>{{ t('duration', { minutes: completedTest.durationMinutes }) }}</p>
  <p>
    {{
      t('answerBreakdown', {
        correct: completedTest.correctAnswers,
        wrong: completedTest.wrongAnswers,
        total: completedTest.totalQuestions
      })
    }}
  </p>
</div>
