<section class="cta" *transloco="let t; prefix: 'landing'">
  <div class="wrap">
    <div class="cta-box">
      <div>
        <h2>{{ t('cta.title') }}</h2>
        <p>{{ t('cta.description') }}</p>
      </div>
      <div class="cta-actions">
        <a mat-flat-button class="btn btn-white" [href]="registerStudentUrl">{{ t('cta.student') }}</a>
        <a mat-stroked-button class="btn btn-glass" [href]="registerTeacherUrl">{{ t('cta.teacher') }}</a>
      </div>
    </div>
  </div>
</section>
