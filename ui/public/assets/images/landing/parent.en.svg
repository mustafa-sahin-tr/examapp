<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="t d">
  <title id="t">Parent panel</title>
  <desc id="d">The child's weekly study chart, latest test result, a badge earned and a private lesson request waiting for approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F7FF"/>
      <stop offset="1" stop-color="#EFEAFF"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8677E0"/><stop offset="1" stop-color="#4A33D1"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#84F0E1"/><stop offset="1" stop-color="#00A894"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE4A1"/><stop offset="1" stop-color="#FFBA0D"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#130F25" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="600" height="440" rx="28" fill="url(#bg)"/>

  <!-- child panel -->
  <g filter="url(#sh)" transform="translate(32 34)">
    <rect width="340" height="250" rx="20" fill="#FFFFFF"/>
    <circle cx="44" cy="44" r="22" fill="url(#violet)"/>
    <text x="44" y="51" text-anchor="middle" font-family="Manrope, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">E</text>
    <text x="78" y="40" font-family="Manrope, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#211D3A">Elif</text>
    <text x="78" y="60" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" fill="#6B6785">Grade 7 · this week</text>
    <rect x="232" y="28" width="86" height="30" rx="15" fill="#E6FAF6"/>
    <text x="275" y="48" text-anchor="middle" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#00806F">4 h 20 min</text>

    <!-- weekly bars -->
    <g transform="translate(28 92)" font-family="Manrope, 'Segoe UI', sans-serif" font-size="12" fill="#6B6785" text-anchor="middle">
      <line x1="0" y1="110" x2="284" y2="110" stroke="#ECEAF5" stroke-width="2"/>
      <rect x="8"   y="60" width="26" height="50" rx="7" fill="url(#violet)"/><text x="21"  y="130">Mon</text>
      <rect x="48"  y="34" width="26" height="76" rx="7" fill="url(#violet)"/><text x="61"  y="130">Tue</text>
      <rect x="88"  y="78" width="26" height="32" rx="7" fill="url(#violet)"/><text x="101" y="130">Wed</text>
      <rect x="128" y="18" width="26" height="92" rx="7" fill="url(#violet)"/><text x="141" y="130">Thu</text>
      <rect x="168" y="50" width="26" height="60" rx="7" fill="url(#violet)"/><text x="181" y="130">Fri</text>
      <rect x="208" y="88" width="26" height="22" rx="7" fill="#D9D3F7"/><text x="221" y="130">Sat</text>
      <rect x="248" y="70" width="26" height="40" rx="7" fill="url(#teal)"/><text x="261" y="130">Sun</text>
    </g>
  </g>

  <!-- test result -->
  <g filter="url(#sh)" transform="translate(394 34)">
    <rect width="176" height="122" rx="18" fill="#FFFFFF"/>
    <text x="20" y="34" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" fill="#6B6785">Latest test</text>
    <text x="20" y="56" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#211D3A">Fractions</text>
    <text x="20" y="96" font-family="Manrope, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#00A894">17/20</text>
    <circle cx="138" cy="84" r="20" fill="none" stroke="#E6FAF6" stroke-width="7"/>
    <path d="M138 64 A20 20 0 1 1 119.6 76.2" fill="none" stroke="#00A894" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- badge -->
  <g filter="url(#sh)" transform="translate(394 174)">
    <rect width="176" height="110" rx="18" fill="#FFFFFF"/>
    <g transform="translate(46 54)">
      <path d="M-12 22 L-18 58 L0 50 L18 58 L12 22z" fill="#FE3F10" transform="translate(0 -14)"/>
      <circle r="26" fill="url(#gold)"/>
      <path d="M0 -13l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.4L0 8.6l-8.4 4.5 1.6-9.4-6.9-6.7 9.5-1.4z" fill="#FFFFFF"/>
    </g>
    <text x="84" y="50" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" fill="#6B6785">New badge</text>
    <text x="84" y="70" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#211D3A">7-day streak</text>
  </g>

  <!-- private lesson approval -->
  <g filter="url(#sh)" transform="translate(32 306)">
    <rect width="538" height="102" rx="20" fill="#FFFFFF"/>
    <rect x="22" y="26" width="50" height="50" rx="14" fill="#EFEAFF"/>
    <path d="M36 42h16a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H36a3 3 0 0 1-3-3V45a3 3 0 0 1 3-3z M55 48l8-5v16l-8-5z" fill="#4A33D1"/>
    <text x="90" y="46" font-family="Manrope, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#211D3A">Lesson request · Maths</text>
    <text x="90" y="68" font-family="Manrope, 'Segoe UI', sans-serif" font-size="13" fill="#6B6785">Thursday 17:00 · awaiting approval</text>
    <rect x="404" y="32" width="110" height="38" rx="19" fill="url(#violet)"/>
    <text x="459" y="56" text-anchor="middle" font-family="Manrope, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Approve</text>
  </g>
</svg>
