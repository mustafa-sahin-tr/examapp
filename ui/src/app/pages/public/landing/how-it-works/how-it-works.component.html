<section class="sec" id="nasil-calisir" *transloco="let t; prefix: 'landing'">
  <div class="wrap">
    <div class="sec-head">
      <span class="kicker">{{ t('howItWorks.kicker') }}</span>
      <h2>{{ t('howItWorks.title') }}</h2>
    </div>
    <mat-tab-group class="how-tabs" mat-stretch-tabs="false" mat-align-tabs="center" animationDuration="0ms">
      @for (role of roles; track role) {
        <mat-tab [label]="t('howItWorks.tabs.' + role)">
          <ol class="steps">
            @for (n of steps; track n) {
              <li class="step">
                <span class="n" aria-hidden="true">{{ n }}</span>
                <h3>{{ t('howItWorks.' + role + '.step' + n + '.title') }}</h3>
                <p>{{ t('howItWorks.' + role + '.step' + n + '.text') }}</p>
              </li>
            }
          </ol>
        </mat-tab>
      }
    </mat-tab-group>
  </div>
</section>
