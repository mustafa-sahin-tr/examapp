<div class="ms-transition">
  <div class="ms-transition-inner">
    <div class="ms-brand">
      <span class="ms-brand-mark" aria-hidden="true"><mat-icon>school</mat-icon></span>
      <h1 class="ms-app-title">{{ brandName }}</h1>
    </div>

    <div class="ms-transition-card">
      <h2 class="ms-greeting">Güle güle, {{ userName }}!</h2>

      <div class="ms-spinner" aria-hidden="true">
        <div class="ms-dot"></div>
        <div class="ms-dot"></div>
        <div class="ms-dot"></div>
      </div>

      <div class="ms-loading-text" role="status">
        <h3>{{ currentMessage }}</h3>
        <p>Lütfen bekleyiniz...</p>
      </div>

      <div class="ms-progress-steps">
        <div class="ms-step" [class.ms-step-active]="currentStep >= 1" [class.ms-step-completed]="currentStep > 1">
          <div class="ms-step-circle">
            @if (currentStep > 1) {
              <mat-icon>check</mat-icon>
            } @else {
              <mat-icon>logout</mat-icon>
            }
          </div>
          <span class="ms-step-label">Oturum Sonlandırma</span>
        </div>
        <div class="ms-step-connector" [class.ms-step-connector-active]="currentStep >= 2"></div>
        <div class="ms-step" [class.ms-step-active]="currentStep >= 2" [class.ms-step-completed]="currentStep > 2">
          <div class="ms-step-circle">
            @if (currentStep > 2) {
              <mat-icon>check</mat-icon>
            } @else {
              <mat-icon>cleaning_services</mat-icon>
            }
          </div>
          <span class="ms-step-label">Veri Temizleme</span>
        </div>
        <div class="ms-step-connector" [class.ms-step-connector-active]="currentStep >= 3"></div>
        <div class="ms-step" [class.ms-step-active]="currentStep >= 3" [class.ms-step-completed]="currentStep > 3">
          <div class="ms-step-circle">
            @if (currentStep > 3) {
              <mat-icon>check</mat-icon>
            } @else {
              <mat-icon>exit_to_app</mat-icon>
            }
          </div>
          <span class="ms-step-label">Çıkış</span>
        </div>
      </div>
    </div>
  </div>
</div>
