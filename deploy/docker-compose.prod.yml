services:
  caddy:
    image: caddy:2
    container_name: exam-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Optional. Set to 'tls internal' for temporary self-signed certs (debug/emergency).
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ocelot-gateway
    networks:
      - exam-net

  postgres:
    image: postgres:14
    container_name: exam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Keep default DB minimal; we create per-service DBs via init scripts
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - exam-net

  redis:
    image: redis:7
    container_name: exam-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - exam-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: exam-rabbitmq
    restart: unless-stopped
    environment:
      # RABBITMQ_USER/PASS is the ops-only admin account (management UI,
      # rabbitmq-init below). Issue #279: application services no longer use
      # it — each gets its own least-privilege user, created by rabbitmq-init
      # at startup instead of a committed rabbitmq/definitions.json (which
      # would require baking prod passwords into a tracked file).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - exam-net

  # Issue #279: one-shot init job — creates the 5 per-service RabbitMQ users
  # and sets their least-privilege permissions via the management HTTP API
  # (same regex matrix as rabbitmq/definitions.json's dev definitions;
  # deploy/scripts/rabbitmq-init.sh is the single source of truth for prod —
  # keep both files' regexes in sync by hand, there is no shared import
  # between them). Idempotent (PUT upserts), so safe to run on every deploy —
  # `restart: "no"` + the other services' `service_completed_successfully`
  # dependency below ensures it always finishes before they start, without
  # blocking subsequent deploys where it's already run.
  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: exam-rabbitmq-init
    restart: 'no'
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_EXAM_OUTBOX_PASSWORD: ${RABBITMQ_EXAM_OUTBOX_PASSWORD}
      RABBITMQ_IDENTITY_OUTBOX_PASSWORD: ${RABBITMQ_IDENTITY_OUTBOX_PASSWORD}
      RABBITMQ_BADGE_OUTBOX_PASSWORD: ${RABBITMQ_BADGE_OUTBOX_PASSWORD}
      RABBITMQ_BADGE_SERVICE_PASSWORD: ${RABBITMQ_BADGE_SERVICE_PASSWORD}
      RABBITMQ_EXAM_API_PASSWORD: ${RABBITMQ_EXAM_API_PASSWORD}
      RABBITMQ_AUTH_API_PASSWORD: ${RABBITMQ_AUTH_API_PASSWORD}
    volumes:
      - ./scripts/rabbitmq-init.sh:/rabbitmq-init.sh:ro
    entrypoint: ['sh', '/rabbitmq-init.sh']
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - exam-net

  minio:
    image: minio/minio
    container_name: exam-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - exam-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: exam-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      KC_HTTP_ENABLED: 'true'
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${DOMAIN}
      KC_HEALTH_ENABLED: 'true'
    volumes:
      # Drop your exported realm JSON(s) here (DO NOT commit them): deploy/keycloak/import/*.json
      # Issue #238: this directory is gitignored and MUST stay empty in the repo —
      # deploy/keycloak/dev-import/ (dev-only fixture, public dev secrets) is a
      # separate path used only by docker-compose.override.yml/AppHost.cs and is
      # never synced here by the deploy workflow.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/keycloak-themes/my-theme:/opt/keycloak/themes/my-theme:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exam-net

  question-detector:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/question-detector.Dockerfile
    container_name: exam-question-detector
    restart: unless-stopped
    networks:
      - exam-net

  exam-dotnet-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-web.Dockerfile
      args:
        PROJECT_PATH: api/ExamApp.Api/ExamApp.Api.csproj
        APP_DLL: ExamApp.Api.dll
        EXPOSE_PORT: 5079
    container_name: exam-dotnet-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5079
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=worksheet_v2;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AuthApiBaseUrl: http://auth-api:5079
      Jwt__Key: ${JWT_KEY}
      Server__BaseUrl: ${PUBLIC_BASE_URL}
      MinioConfig__Endpoint: minio:9000
      MinioConfig__AccessKey: ${MINIO_ROOT_USER}
      MinioConfig__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinioConfig__BaseUrl: ${PUBLIC_BASE_URL}/img
      Redis__Configuration: redis:6379,password=${REDIS_PASSWORD}
      Keycloak__Host: http://keycloak:8080
      Keycloak__Realm: exam-realm     
      Keycloak__Authority: ${PUBLIC_BASE_URL}/realms/exam-realm
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      Keycloak__TokenUrl: realms/exam-realm/protocol/openid-connect/token
      Keycloak__RealmRolesUrl: admin/realms/exam-realm/roles
      # Issue #225: exam API hosts a MassTransit consumer (queue "exam-api") for
      # BadgeService's StudentPointsChangedEvent. In Production a missing
      # RabbitMQ__Host fails startup.
      # Issue #279: dedicated least-privilege user (read-only on its own
      # "exam-api" queue, cannot publish/forge StudentPointsChangedEvent) —
      # created by the rabbitmq-init job below, not the shared admin user.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: exam_api
      RabbitMQ__Password: ${RABBITMQ_EXAM_API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - exam-net

  auth-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-web.Dockerfile
      args:
        PROJECT_PATH: auth-api/ExamApp.Api.csproj
        APP_DLL: ExamApp.Api.dll
        EXPOSE_PORT: 5079
    container_name: auth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5079
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Server__BaseUrl: ${PUBLIC_BASE_URL}
      MinioConfig__Endpoint: minio:9000
      MinioConfig__AccessKey: ${MINIO_ROOT_USER}
      MinioConfig__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinioConfig__BaseUrl: ${PUBLIC_BASE_URL}/img
      Keycloak__Authority: ${PUBLIC_BASE_URL}/realms/exam-realm
      Keycloak__Host: http://keycloak:8080      
      Keycloak__Realm: exam-realm           
      Keycloak__TokenUrl: realms/exam-realm/protocol/openid-connect/token
      Keycloak__UserUrl: admin/realms/exam-realm/users
      Keycloak__RealmRolesUrl: admin/realms/exam-realm/roles
      Keycloak__LogoutUrl: admin/realms/exam-realm/users/{0}/logout
      Keycloak__RedirectUri: ${PUBLIC_BASE_URL}/app/callback
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Issue #277 (madde 4): auth-api hosts a MassTransit consumer (queue "auth-api") for
      # exam API's UserRoleChangedEvent. Same pattern as exam-dotnet-api's StudentPointsChangedEvent
      # consumer above. Dedicated least-privilege user (read-only on its own "auth-api" queue,
      # cannot publish/forge UserRoleChangedEvent) — created by the rabbitmq-init job below.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: auth_api
      RabbitMQ__Password: ${RABBITMQ_AUTH_API_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - exam-net

  exam-badge-api:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-web.Dockerfile
      args:
        PROJECT_PATH: Services/BadgeService/BadgeService.csproj
        APP_DLL: BadgeService.dll
        EXPOSE_PORT: 8006
    container_name: exam-badge-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Port: 8006
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=badge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Server__BaseUrl: ${PUBLIC_BASE_URL}
      # Issue #279: dedicated least-privilege user — every outbox event
      # except StudentPointsChangedEvent, never write access to it.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: badge_service
      RabbitMQ__Password: ${RABBITMQ_BADGE_SERVICE_PASSWORD}
      Keycloak__Authority: ${PUBLIC_BASE_URL}/realms/exam-realm
      Keycloak__Host: http://keycloak:8080
      Keycloak__Realm: exam-realm
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      Keycloak__TokenUrl: realms/exam-realm/protocol/openid-connect/token
      Keycloak__RealmRolesUrl: admin/realms/exam-realm/roles
      MinioConfig__Endpoint: minio:9000
      MinioConfig__AccessKey: ${MINIO_ROOT_USER}
      MinioConfig__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinioConfig__BaseUrl: ${PUBLIC_BASE_URL}/img
      ExamApi__BaseUrl: http://exam-dotnet-api:5079
      # Issue #165: caller user id lookup via GET /api/auth/user-profile on
      # auth-api. Same value as exam-dotnet-api's AuthApiBaseUrl above.
      AuthApi__BaseUrl: http://auth-api:5079
      QuestionAnalyzer__AIActive: ${BADGE_AI_ACTIVE:-true}
      Gemini__Model: ${GEMINI_MODEL:-models/gemini-3.5-flash-lite}
      Gemini__CachedContent: ${GEMINI_CACHED_CONTENT}
      Gemini__ApiKey: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      auth-api:
        condition: service_started
    networks:
      - exam-net

  exam-outbox-publisher:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-worker.Dockerfile
      args:
        PROJECT_PATH: Services/OutboxPublisher/OutboxPublisherService.csproj
        APP_DLL: OutboxPublisherService.dll
    container_name: exam-outbox-publisher
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=worksheet_v2;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Issue #279: dedicated least-privilege user — write access only to the
      # worksheet-DB outbox event exchanges, no queue/read access.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: exam_outbox_pub
      RabbitMQ__Password: ${RABBITMQ_EXAM_OUTBOX_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - exam-net

  # Issue #84 / #243: second instance of the same OutboxPublisher code, pointed
  # at auth-api's "auth_db" database. auth-api writes its own outbox events
  # (e.g. account/notification events) to this DB; this relay publishes them
  # to RabbitMQ. Same image as exam-outbox-publisher (see
  # docker-compose.prod.images.yml); only the connection string differs.
  identity-outbox-publisher:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-worker.Dockerfile
      args:
        PROJECT_PATH: Services/OutboxPublisher/OutboxPublisherService.csproj
        APP_DLL: OutboxPublisherService.dll
    container_name: identity-outbox-publisher
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auth_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Issue #279: dedicated least-privilege user — write access only to
      # LoginAttemptedEvent/UserPreferredLocaleChangedEvent, no queue/read.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: identity_outbox_pub
      RabbitMQ__Password: ${RABBITMQ_IDENTITY_OUTBOX_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      # auth-api applies the auth_db migrations (OutboxMessages table).
      auth-api:
        condition: service_started
    networks:
      - exam-net

  # Issue #225: third instance of the same OutboxPublisher code, pointed at
  # BadgeService's "badge" DB. BadgeService writes StudentPointsChangedEvent to
  # its own OutboxMessages table; this relay publishes it to RabbitMQ for
  # exam-dotnet-api's "exam-api" queue. Without it the badge outbox table grows
  # unbounded and leaderboard points never sync. Same image as
  # exam-outbox-publisher (see docker-compose.prod.images.yml); only the
  # connection string differs.
  badge-outbox-publisher:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/dotnet-worker.Dockerfile
      args:
        PROJECT_PATH: Services/OutboxPublisher/OutboxPublisherService.csproj
        APP_DLL: OutboxPublisherService.dll
    container_name: badge-outbox-publisher
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=badge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Issue #279: dedicated least-privilege user — the ONLY user allowed to
      # write StudentPointsChangedEvent (closes the fake-event risk).
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: badge_outbox_pub
      RabbitMQ__Password: ${RABBITMQ_BADGE_OUTBOX_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully
      # exam-badge-api applies the badge DB migrations (OutboxMessages table).
      exam-badge-api:
        condition: service_started
    networks:
      - exam-net

  angular-app:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/angular-spa.Dockerfile
      args:
        APP_DIR: ui
    container_name: angular-app
    restart: unless-stopped
    networks:
      - exam-net

  auth-ui:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/angular-spa.Dockerfile
      args:
        APP_DIR: auth-ui
    container_name: auth-ui
    restart: unless-stopped
    networks:
      - exam-net

  ocelot-gateway:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/gateway.Dockerfile
      args:
        PROJECT_PATH: Services/Gateway/Gateway.csproj
        OCELOT_ENVIRONMENT: Production
        APP_DLL: Gateway.dll
        EXPOSE_PORT: 5678
    container_name: ocelot-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Port: 5678
      Server__BaseUrl: ${PUBLIC_BASE_URL}
      Keycloak__Realm: exam-realm
      Keycloak__ClientCallbackUrl: ${PUBLIC_BASE_URL}/app/callback&response_type=code&scope=openid&state=${PUBLIC_BASE_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL}
      Keycloak__Host: http://keycloak:8080
    depends_on:
      - angular-app
      - auth-ui
      - exam-dotnet-api
      - auth-api
      - exam-badge-api
      - keycloak
      - minio
      - rabbitmq
      - redis
      - question-detector
    networks:
      - exam-net

networks:
  exam-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  caddy_data:
  caddy_config:
